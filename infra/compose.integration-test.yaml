name: educore-postgres-integration

services:
  postgres-integration:
    image: postgres:18.4-alpine
    environment:
      POSTGRES_DB: educore_integration
      POSTGRES_USER: educore_integration
      POSTGRES_PASSWORD: educore-integration-only
    ports:
      - "127.0.0.1:${EDUCORE_TEST_POSTGRES_PORT:-55432}:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U educore_integration -d educore_integration"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: "no"
    security_opt:
      - no-new-privileges:true
