version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "03:30"
      timezone: Asia/Kolkata
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    groups:
      web-minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: maven
    directory: /apps/api
    schedule:
      interval: weekly
      day: monday
      time: "03:45"
      timezone: Asia/Kolkata
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    groups:
      api-minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    cooldown:
      default-days: 7
  - package-ecosystem: docker
    directory: /apps/web
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
  - package-ecosystem: docker
    directory: /apps/api
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
