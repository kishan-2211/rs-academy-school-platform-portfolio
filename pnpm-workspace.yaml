packages:
  - apps/*
  - packages/*

# Preserve the repository's strict engine policy in builds without importing
# developer registry configuration/credentials from .npmrc.
engineStrict: true
confirmModulesPurge: false
blockExoticSubdeps: true
minimumReleaseAge: 10080
minimumReleaseAgeExclude:
  # Owner-approved November 1 framework security repair. Only these exact
  # aligned versions bypass the seven-day delay; future releases do not.
  - next@16.4.1
  - eslint-config-next@16.4.1
  - '@next/env@16.4.1'
  - '@next/eslint-plugin-next@16.4.1'
  - '@next/swc-darwin-arm64@16.4.1'
  - '@next/swc-darwin-x64@16.4.1'
  - '@next/swc-linux-arm64-gnu@16.4.1'
  - '@next/swc-linux-arm64-musl@16.4.1'
  - '@next/swc-linux-x64-gnu@16.4.1'
  - '@next/swc-linux-x64-musl@16.4.1'
  - '@next/swc-win32-arm64-msvc@16.4.1'
  - '@next/swc-win32-x64-msvc@16.4.1'
  # Emergency fix for the audited Sharp/libvips CVEs. Keep these exceptions
  # version-scoped so future releases remain subject to the seven-day delay.
  # Owner-approved October 7 Sharp/librsvg security patch and exact native closure.
  - sharp@0.35.5
  - '@img/sharp-darwin-arm64@0.35.5'
  - '@img/sharp-darwin-x64@0.35.5'
  - '@img/sharp-freebsd-wasm32@0.35.5'
  - '@img/sharp-linux-arm@0.35.5'
  - '@img/sharp-linux-arm64@0.35.5'
  - '@img/sharp-linux-ppc64@0.35.5'
  - '@img/sharp-linux-riscv64@0.35.5'
  - '@img/sharp-linux-s390x@0.35.5'
  - '@img/sharp-linux-x64@0.35.5'
  - '@img/sharp-linuxmusl-arm64@0.35.5'
  - '@img/sharp-linuxmusl-x64@0.35.5'
  - '@img/sharp-wasm32@0.35.5'
  - '@img/sharp-webcontainers-wasm32@0.35.5'
  - '@img/sharp-win32-arm64@0.35.5'
  - '@img/sharp-win32-ia32@0.35.5'
  - '@img/sharp-win32-x64@0.35.5'
  - '@img/sharp-libvips-darwin-arm64@1.3.4'
  - '@img/sharp-libvips-darwin-x64@1.3.4'
  - '@img/sharp-libvips-linux-arm@1.3.4'
  - '@img/sharp-libvips-linux-arm64@1.3.4'
  - '@img/sharp-libvips-linux-ppc64@1.3.4'
  - '@img/sharp-libvips-linux-riscv64@1.3.4'
  - '@img/sharp-libvips-linux-s390x@1.3.4'
  - '@img/sharp-libvips-linux-x64@1.3.4'
  - '@img/sharp-libvips-linuxmusl-arm64@1.3.4'
  - '@img/sharp-libvips-linuxmusl-x64@1.3.4'
  - source-map-js@1.2.2
minimumReleaseAgeExcludePrune: true
trustPolicy: no-downgrade
trustPolicyExclude:
  # Existing audited transitive releases whose later publisher metadata is
  # stronger. Keep exceptions exact so future versions remain verified.
  - eslint-import-resolver-typescript@3.10.1
  - semver@6.3.1
  - undici-types@6.21.0
allowBuilds:
  sharp: true
  unrs-resolver: true

overrides:
  # Patch both vulnerable minimatch trees without crossing major versions.
  'brace-expansion@^1.0.0': 1.1.21
  'brace-expansion@^5.0.0': 5.0.12
  # GHSA-2883-xcg3-v3hh: include YAML consumed transitively by lint tooling.
  js-yaml: 4.3.2
  postcss: 8.5.26
  sharp: 0.35.5
  source-map-js: 1.2.2
  # Owner-approved scoped repair for GHSA-mrhx-c7xc-m3w5.
  zod: 4.6.6
