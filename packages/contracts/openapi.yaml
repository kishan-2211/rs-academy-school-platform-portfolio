components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: educore_session
  parameters:
    PayrollReportFrom:
      name: from
      in: query
      required: true
      description: Inclusive range start. Salary register requires the first day of a payroll month.
      schema: { type: string, format: date }
    PayrollReportTo:
      name: to
      in: query
      required: true
      description: Inclusive range end, not before from and no more than 3660 days later. Register requires a month first day.
      schema: { type: string, format: date }
    PayrollReportStaff:
      name: staffProfileId
      in: query
      schema: { type: string, format: uuid }
    PayrollAdvanceDueThrough:
      name: dueThrough
      in: query
      required: true
      description: Installments on or before this date's calendar month are classified as due. Ledger and reversal evidence remains current at read time.
      schema: { type: string, format: date }
    PayrollReportSearch:
      name: search
      in: query
      description: Case-insensitive literal substring of frozen employee code or staff name. No wildcard syntax or control characters.
      schema: { type: string, maxLength: 100, default: "" }
    PayrollReportPage:
      name: page
      in: query
      schema: { type: integer, minimum: 0, maximum: 10000, default: 0 }
    PayrollReportSize:
      name: size
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
    ApplicationId:
      name: applicationId
      in: path
      required: true
      schema: { type: string, format: uuid }
    LearnerId:
      name: learnerId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ImportBatchId:
      name: batchId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ImportRowId:
      name: rowId
      in: path
      required: true
      schema: { type: string, format: uuid }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 16
        maxLength: 100
        pattern: "^[A-Za-z0-9._:-]+$"
    CsrfToken:
      name: X-CSRF-TOKEN
      in: header
      required: true
      schema: { type: string }
  responses:
    AcademicMutationCreated:
      description: Academic configuration record created.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/AcademicMutationResponse" }
    AcademicMutationOk:
      description: Academic configuration or timetable mutation completed.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/AcademicMutationResponse" }
    AttendanceMutationCreated:
      description: Attendance configuration or workflow record created.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/AttendanceMutationResponse" }
    AttendanceMutationOk:
      description: Attendance configuration or workflow mutation completed.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/AttendanceMutationResponse" }
    WorkforceMutationCreated:
