  /public/fee-gateway/webhooks/{routeKey}:
    post:
      operationId: retainVerifiedFeeGatewayWebhook
      tags: [Finance]
      summary: Authenticate original provider bytes and retain a minimal durable callback
      description: >-
        Provider-only callback, not a browser payment-confirmation or financial-posting API.
        The opaque route key resolves only a complete server-owned provider binding; callers
        cannot select a school, merchant, credentials or payment amount through this route.
        Incidental session cookies and principals do not authenticate this exact POST path.
        No browser session or CSRF token is required, and no other session, MFA or finance
        boundary is exempted. A valid HMAC authenticates the exact original bounded bytes
        before JSON parsing. No callback timestamp age cutoff discards a delayed authentic
        retry. Only minimal references and a body digest are retained, never raw private
        customer/card payloads. No merchant is activated by this endpoint. All responses
        are empty and no-store and expose no route, school, inbox or payment details.
      security: []
      parameters:
        - name: routeKey
          in: path
          required: true
          description: Canonical lower-case hex or unpadded base64url encoding of an opaque 32-byte server routing key. Syntax alone grants no authority.
          schema: { type: string, minLength: 43, maxLength: 64, pattern: '^(?:[a-f0-9]{64}|[A-Za-z0-9_-]{43})$' }
        - name: x-webhook-signature
          in: header
          required: true
          description: Exactly one canonical standard-base64 HMAC-SHA256 value. Duplicate, comma-joined, blank or whitespace-padded values are rejected.
          schema: { type: string, minLength: 44, maxLength: 44, pattern: '^[A-Za-z0-9+/]{43}=$' }
        - name: x-webhook-timestamp
          in: header
          required: true
          description: Exactly one canonical 13-digit provider timestamp, included unchanged in signature verification. Duplicate or comma-joined values are rejected.
          schema: { type: string, minLength: 13, maxLength: 13, pattern: '^[1-9][0-9]{12}$' }
      requestBody:
        required: true
        x-max-body-bytes: 262144
        description: >-
          Original nonempty JSON bytes, at most 262144 bytes, including unknown-length/chunked
          delivery. Read with a MAX+1 byte bound before deserialization. Only application/json
          with absent or one UTF-8 charset parameter is accepted; duplicate/conflicting or
          additional media parameters are rejected. Actual bytes must be well-formed UTF-8,
          without raw NUL; UTF-16/32 auto-detection and malformed sequence replacement are
          not permitted. Compression and multipart are unsupported;
          Content-Encoding must be absent or identity. Neither body conversion nor whitespace,
          field ordering or Unicode normalization may change the signed bytes.
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        "204":
          description: Authentic minimal callback committed to the durable inbox, or the identical previously committed inbox returned. This acknowledges intake only, never a paid fee, receipt, refund or settlement.
          headers:
            Cache-Control: { schema: { type: string, const: no-store } }
        "400":
          description: Empty response for malformed, missing, duplicate or noncanonical signature/timestamp headers, an empty body or invalid UTF-8 byte format. No intake acknowledgement.
        "404":
          description: Empty response for a noncanonical or mismatched raw callback path. No intake acknowledgement.
        "413":
          description: Empty response for a declared or actually streamed body over 262144 bytes. No intake acknowledgement.
        "415":
          description: Empty response for unsupported, missing or ambiguous JSON content type, non-UTF-8 charset, multipart or compression. No intake acknowledgement.
        "503":
          description: Empty retryable response when authentication, configured route/key, reading or durable commit cannot be established. No success acknowledgement or diagnostic distinction is exposed.
          headers:
            Retry-After: { description: Seconds before retrying the unchanged original signed callback., schema: { type: integer, const: 60 } }
            Cache-Control: { schema: { type: string, const: no-store } }
