      type: object
      required: [invitationId, setupToken, expiresAt]
      properties:
        invitationId: { type: string, format: uuid }
        setupToken:
          type: string
          minLength: 43
          maxLength: 43
          pattern: '^[A-Za-z0-9_-]{43}$'
          description: One-use secret returned only on the first successful handoff reveal. Render in a URL fragment for the verified holder; never store, log, automatically copy or repeat it.
        expiresAt: { type: string, format: date-time }
