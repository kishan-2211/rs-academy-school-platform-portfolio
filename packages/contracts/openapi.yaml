      description: Requires payroll.read and accounting.read in the same active school scope. Audited, no-store, repeatable-read evidence. From/to are inclusive posting dates. An employee filter selects entire matching batches, not partial amounts. Matching confirms source/journal totals and reversal offsets, not external bank settlement or accounting policy correctness. Pages contain at most 100 rows and total matching count; never interpret one page as the complete report.
