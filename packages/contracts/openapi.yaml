        userId: { type: string, format: uuid }
        loginIdentifier: { type: string, minLength: 3, maxLength: 254 }
        email: { type: [string, "null"], format: email }
        displayName: { type: string }
        expiresAt: { type: string, format: date-time }
        mfaVerified: { type: boolean }
    LoginResponse:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          enum: [authenticated, mfa_required]
        session:
          $ref: "#/components/schemas/AuthSession"
        challengeToken:
          type: string
          minLength: 32
          maxLength: 128
        challengeExpiresAt: { type: string, format: date-time }
      oneOf:
        - required: [status, session]
          properties:
            status: { const: authenticated }
        - required: [status, challengeToken, challengeExpiresAt]
          properties:
            status: { const: mfa_required }
    VerifyMfaCodeRequest:
      type: object
      additionalProperties: false
      required: [code]
      properties:
        code:
          type: string
          pattern: "^(?:[0-9]{6}|[A-Za-z2-9-]{20,40})$"
    VerifyMfaChallengeRequest:
      type: object
      additionalProperties: false
      required: [challengeToken, code]
      properties:
        challengeToken:
          type: string
          minLength: 32
          maxLength: 128
          pattern: "^[A-Za-z0-9_-]+$"
        code:
          type: string
          pattern: "^(?:[0-9]{6}|[A-Za-z2-9-]{20,40})$"
    SessionSummary:
      type: object
      required:
        [id, deviceName, createdAt, lastSeenAt, expiresAt, current, mfaVerified]
      properties:
        id: { type: string, format: uuid }
        deviceName: { type: string }
        createdAt: { type: string, format: date-time }
        lastSeenAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
        current: { type: boolean }
        mfaVerified: { type: boolean }
    MfaStatus:
      type: object
      required: [enabled, factors, unusedRecoveryCodes, sessionVerified]
      properties:
        enabled: { type: boolean }
        factors:
          type: array
          items:
            type: object
            required: [id, type, label, verifiedAt]
            properties:
              id: { type: string, format: uuid }
              type: { type: string, const: totp }
              label: { type: string }
              verifiedAt: { type: string, format: date-time }
        unusedRecoveryCodes: { type: integer, minimum: 0, maximum: 10 }
        sessionVerified:
          type: boolean
          description: Whether this current HttpOnly session completed an MFA challenge; enrolling a factor does not set this flag.
    TotpEnrollment:
      type: object
      required: [factorId, secret, provisioningUri, expiresAt]
      properties:
        factorId: { type: string, format: uuid }
        secret: { type: string, pattern: "^[A-Z2-7]+$" }
        provisioningUri: { type: string, pattern: "^otpauth://totp/" }
        expiresAt: { type: string, format: date-time }
    RecoveryCodes:
      type: object
      required: [recoveryCodes]
      properties:
        recoveryCodes:
          type: array
          minItems: 10
          maxItems: 10
          items: { type: string }
    CurrentContext:
      type: object
      required: [organisations, capabilities, selectionRequired, mfaRequired]
      properties:
        activeOrganisationId:
          type: [string, "null"]
          format: uuid
        organisations:
          type: array
          items:
            type: object
            required: [id, displayName, slug, membershipCount, active]
            properties:
              id: { type: string, format: uuid }
              displayName: { type: string }
              slug: { type: string }
              membershipCount: { type: integer, minimum: 1 }
              active: { type: boolean }
        capabilities:
          type: array
          uniqueItems: true
          items: { type: string }
        selectionRequired: { type: boolean }
        mfaRequired:
          type: boolean
          description: In production, a live RESTRICTED grant in the selected organization requires MFA verification. Business APIs return 403 MFA_VERIFICATION_REQUIRED until a fresh MFA sign-in. Only precise owned security/context/preferences setup and existing public authentication endpoints remain available; this flag never grants authority.
    FieldViolation:
      type: object
      required: [field, message, code]
      properties:
        field: { type: string }
        message: { type: string }
        code: { type: string }
    ApiProblem:
      type: object
      required:
        [
          type,
          title,
          status,
          detail,
          code,
          instance,
          requestId,
          timestamp,
          violations,
          details,
        ]
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer, minimum: 400, maximum: 599 }
        detail: { type: string }
        code: { type: string }
        instance: { type: string, format: uri-reference }
        requestId: { type: string }
        timestamp: { type: string, format: date-time }
        violations:
          type: array
          items:
            $ref: "#/components/schemas/FieldViolation"
        details: { type: object, additionalProperties: true }
