  /family/children/{learnerId}/fee-payments:
    get:
      operationId: listFamilyGatewayPayments
      tags: [Family portal, Finance]
      summary: Read the verified online-payment history of an authorized child
      description: >-
        Requires a live HttpOnly browser session with portal.guardian and an active,
        accepted guardian relationship, current membership and the exact school/account
        scope. Historical session accounts are checked independently. This is a read-only
        database view, not provider I/O, payment confirmation, reservation release or
        private checkout-link disclosure. Results are ordered by creation time and attempt
        ID descending, with 20 items per page. Disabling new checkout does not hide existing
        history. Availability describes whether a new request may currently be started;
        it does not imply that any existing payment failed. Successful responses are private,
        no-store, vary on Cookie and use no-referrer. No payer phone, provider credentials,
        route key, webhook payload or hosted checkout URL is returned.
      security: [{ sessionCookie: [] }]
      parameters:
        - { $ref: "#/components/parameters/LearnerId" }
        - { name: page, in: query, schema: { type: integer, minimum: 0, maximum: 10000, default: 0 } }
      responses:
        "200":
          description: Verified child-scoped payment summaries; an empty page remains a successful read.
          headers:
            Cache-Control: { schema: { type: string, const: "no-store, private" } }
            Vary: { description: "Includes Cookie; existing CORS processing may add its own vary fields.", schema: { type: string } }
            Referrer-Policy: { schema: { type: string, const: no-referrer } }
            X-Content-Type-Options: { schema: { type: string, const: nosniff } }
          content: { application/json: { schema: { $ref: "#/components/schemas/FamilyGatewayPaymentHistory" } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/FamilyGatewayServerError" }
    post:
      operationId: initiateFamilyGatewayPayment
      tags: [Family portal, Finance]
      summary: Reserve an exact eligible fee selection and enqueue its original gateway attempt
      description: >-
        Requires the same live own-child scope as history and the existing cookie/header
        CSRF protection. With accountId omitted or null, a new request uses CURRENT_SESSION
        selection. An explicit accountId uses immutable EXPLICIT_ACCOUNT selection and may
        target an eligible ACTIVE historical account. A CLOSED account requires independent
        reviewed reopening first; payment selection itself never reopens it or reactivates
        academic enrolment. The backend rechecks the exact ACTIVE
        account, live own-child authority, current school payment enablement,
        outstanding minus already-reserved balances, full-only/partial installment rules,
        accounting-day eligibility and trusted provider binding under the finance fence.
        clientRequestId is the body-level idempotency identity; no Idempotency-Key header
        replaces it. On an uncertain result, retry the exact original key, account selection
        mode/accountId, allocations and payer phone. An acknowledged retry resolves the
        original account, immutable selection mode and frozen terms,
        never a newer session account, and does not create or enqueue a second attempt.
        Changing the original terms is rejected. The private phone is used for this hosted
        checkout and is not returned, logged or saved in browser storage. Reservation and
        durable enqueue commit together. This operation performs no provider network request
        and never marks fees paid, creates a numbered receipt or treats browser success as
        proof. Payment/receipt posting requires separate server-verified money evidence.
        Successful responses are private/no-store and expose no hosted URL or provider secrets.
      security: [{ sessionCookie: [] }]
      parameters:
        - { $ref: "#/components/parameters/LearnerId" }
        - { $ref: "#/components/parameters/CsrfToken" }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/FamilyGatewayInitiateRequest" } } }
      responses:
        "201":
          description: Exact attempt durably reserved/enqueued, or the same original attempt returned after an identical retry. This acknowledges the request, not a paid fee.
          headers:
            Cache-Control: { schema: { type: string, const: "no-store, private" } }
            Vary: { description: "Includes Cookie; existing CORS processing may add its own vary fields.", schema: { type: string } }
            Referrer-Policy: { schema: { type: string, const: no-referrer } }
            X-Content-Type-Options: { schema: { type: string, const: nosniff } }
          content: { application/json: { schema: { $ref: "#/components/schemas/FamilyGatewayPayment" } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/FamilyGatewayServerError" }
  /family/fee-payments/{attemptId}:
    get:
      operationId: getFamilyGatewayPayment
      tags: [Family portal, Finance]
      summary: Read one verified, live-relationship-scoped payment status
      description: >-
        Resolves only the authenticated organisation and actor, then rechecks the exact
