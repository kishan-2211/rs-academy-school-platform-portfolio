    BadRequest:
      description: Request validation failed.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ApiProblem"
    Unauthorized:
      description: Authentication failed or the session is invalid.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ApiProblem"
    Forbidden:
      description: The signed-in account lacks the required scoped capability.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ApiProblem"
    NotFound:
      description: The resource does not exist within the signed-in account's verified scope.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ApiProblem"
    Conflict:
      description: The requested state transition or optimistic version is no longer valid.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ApiProblem"
    FamilyGatewayServerError:
      description: >-
        Generic server/database failure without private provider, contact, SQL or crypto details.
        This is not a payment acknowledgement and does not prove an earlier mutation failed
        to commit. After an uncertain initiation, retain and retry the exact original request
        identity/body and read verified history; do not start or pay a second attempt solely
        because this response or a connection failure was observed.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/ApiProblem" }
    ServiceUnavailable:
      description: A required private infrastructure dependency is temporarily unavailable.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ApiProblem"
    TooManyRequests:
      description: Request throttled by the deployment edge.
      headers:
        Retry-After:
          description: Seconds before the client should retry.
          schema: { type: integer, minimum: 1 }
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ApiProblem"
  schemas:
    StudentLeavePolicyRequest:
      type: object
      required:
        - schoolId
        - sessionId
        - maxCalendarDays
        - retrospectiveDays
        - attendanceState
        - enabled
        - reason
      properties:
        schoolId:
          type: string
          format: uuid
        sessionId:
          type: string
          format: uuid
        maxCalendarDays:
          type: integer
          minimum: 1
          maximum: 366
        retrospectiveDays:
          type: integer
          minimum: 0
          maximum: 90
        attendanceState:
          type: string
          enum:
            - EXCUSED
            - ABSENT
        enabled:
          type: boolean
        expectedVersion:
          type:
            - integer
            - 'null'
          minimum: 0
        reason:
          type: string
          minLength: 3
          maxLength: 500
    StudentLeaveSubmitRequest:
      type: object
      required:
        - sessionId
        - startsOn
        - endsOn
        - leaveType
        - reason
        - idempotencyKey
      properties:
        sessionId:
          type: string
          format: uuid
        startsOn:
          type: string
          format: date
        endsOn:
          type: string
          format: date
        leaveType:
          type: string
          enum:
            - PERSONAL
            - ILLNESS
            - FAMILY
            - OTHER
        reason:
          type: string
          minLength: 3
          maxLength: 1000
        idempotencyKey:
          type: string
          minLength: 8
          maxLength: 100
    StudentLeaveDecisionRequest:
      type: object
      required:
        - schoolId
        - decision
        - expectedVersion
        - reason
      properties:
        schoolId:
          type: string
          format: uuid
        decision:
          type: string
          enum:
            - APPROVED
            - REJECTED
            - REVOKED
        expectedVersion:
          type: integer
          minimum: 0
        reason:
          type: string
          minLength: 3
          maxLength: 1000
    StudentLeaveWithdrawalRequest:
      type: object
      required:
        - expectedVersion
        - reason
      properties:
        expectedVersion:
          type: integer
          minimum: 0
        reason:
          type: string
          minLength: 3
          maxLength: 1000
    StudentLeaveMutation:
      type: object
      required:
        - id
        - rowVersion
        - status
      properties:
        id:
          type: string
          format: uuid
        rowVersion:
          type: integer
          minimum: 0
        status:
          type: string
    StudentLeavePolicy:
      type: object
      required:
        - id
        - sessionId
        - sessionName
        - maxCalendarDays
        - retrospectiveDays
        - attendanceState
        - enabled
        - rowVersion
      properties:
        id:
          type: string
          format: uuid
        sessionId:
          type: string
          format: uuid
        sessionName:
          type: string
        maxCalendarDays:
          type: integer
          minimum: 0
        retrospectiveDays:
          type: integer
          minimum: 0
        attendanceState:
          type: string
        enabled:
          type: boolean
        rowVersion:
          type: integer
          minimum: 0
    StudentLeaveSession:
      type: object
      required:
        - id
        - name
        - startsOn
        - endsOn
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        startsOn:
          type: string
          format: date
        endsOn:
          type: string
          format: date
    StudentLeaveRecord:
      type: object
      required:
        - id
        - learnerId
        - learnerName
        - sessionId
        - startsOn
        - endsOn
        - leaveType
        - reason
        - status
        - lastActionReason
        - createdAt
        - rowVersion
        - canWithdraw
      properties:
        id:
          type: string
          format: uuid
        learnerId:
          type: string
          format: uuid
        learnerName:
          type: string
        sessionId:
          type: string
          format: uuid
        startsOn:
          type: string
          format: date
        endsOn:
          type: string
          format: date
        leaveType:
          type: string
        reason:
          type: string
        status:
          type: string
          enum:
            - SUBMITTED
            - APPROVED
            - REJECTED
            - WITHDRAWN
            - REVOKED
        lastActionReason:
          type: string
        createdAt:
          type: string
          format: date-time
        rowVersion:
          type: integer
          minimum: 0
        canWithdraw:
          type: boolean
    StudentLeaveHistory:
      type: object
      required:
        - newStatus
        - reason
        - occurredAt
        - requestVersion
      properties:
        previousStatus:
          type:
            - string
            - 'null'
        newStatus:
          type: string
        reason:
          type: string
        occurredAt:
          type: string
          format: date-time
        requestVersion:
          type: integer
          minimum: 0
    StudentLeaveDetail:
      type: object
      required:
        - request
        - history
      properties:
        request:
          $ref: '#/components/schemas/StudentLeaveRecord'
        history:
          type: array
          items:
            $ref: '#/components/schemas/StudentLeaveHistory'
    StudentLeavePage:
      type: object
      required:
        - requests
        - total
        - page
        - pageSize
      properties:
        requests:
          type: array
          items:
            $ref: '#/components/schemas/StudentLeaveRecord'
        total:
          type: integer
          minimum: 0
        page:
          type: integer
          minimum: 0
        pageSize:
          type: integer
          minimum: 0
    StudentLeaveWorkspace:
      type: object
      required:
        - schoolId
        - schoolName
        - sessions
        - policies
        - records
      properties:
        schoolId:
          type: string
          format: uuid
        schoolName:
          type: string
        sessions:
          type: array
          items:
            $ref: '#/components/schemas/StudentLeaveSession'
        policies:
          type: array
          items:
            $ref: '#/components/schemas/StudentLeavePolicy'
        records:
          $ref: '#/components/schemas/StudentLeavePage'
    FamilyStudentLeaveWorkspace:
      type: object
      required:
        - learnerId
        - sessions
        - policies
        - records
      properties:
        learnerId:
          type: string
          format: uuid
        sessions:
          type: array
          items:
            $ref: '#/components/schemas/StudentLeaveSession'
        policies:
          type: array
          items:
            $ref: '#/components/schemas/StudentLeavePolicy'
        records:
          $ref: '#/components/schemas/StudentLeavePage'
