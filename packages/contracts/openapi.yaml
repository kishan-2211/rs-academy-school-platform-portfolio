        "200":
          description: Audited CSV attachment; Cache-Control no-store, private; Content-Disposition attachment. No banking or credential fields.
          content: { text/csv: { schema: { type: string } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /payroll/accounting/reports/summary:
    get:
      operationId: getPayrollSummary
      tags: [Payroll]
      summary: Group immutable historical payroll evidence by frozen workforce or deduction dimensions
      description: Requires payroll.read and accounting.read in the same active school scope. Audited, no-store, repeatable-read evidence. From/to are inclusive payroll-month first days. Results are always separated by currency and FINALIZED versus REVERSED run state. Workforce groupings expose explicit legacy, missing, and ambiguous evidence buckets; they never reconstruct historical labels from current assignments. Deduction grouping uses immutable payroll run line snapshots. Pages contain at most 100 rows and total matching group count.
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: schoolId, in: query, schema: { type: string, format: uuid } }
        - { name: groupBy, in: query, required: true, schema: { type: string, enum: [DEPARTMENT, DESIGNATION, DEDUCTION_COMPONENT] } }
        - { $ref: "#/components/parameters/PayrollReportFrom" }
        - { $ref: "#/components/parameters/PayrollReportTo" }
        - { $ref: "#/components/parameters/PayrollReportStaff" }
        - { $ref: "#/components/parameters/PayrollReportSearch" }
        - { $ref: "#/components/parameters/PayrollReportPage" }
        - { $ref: "#/components/parameters/PayrollReportSize" }
