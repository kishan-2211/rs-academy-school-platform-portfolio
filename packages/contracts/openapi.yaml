      tags: [Finance]
      summary: Identify historical fee-payment sources for a complete retained settlement event report
      description: >-
        Requires a real current session and both live school-scoped fees.read and
        accounting.read. This read-only SOURCE_IDENTIFICATION_ONLY stage validates
        the full unfiltered selected COMPLETE EVENTS chain before pagination; a
        filtered page, incomplete scan or UNKNOWN attempt cannot establish a source.
        Each physical sourceReadId/rowIndex is retained, including repeated event
        references. SOURCE_IDENTIFIED means one exact scoped capture, numbered
        receipt, original posted unreversed journal and valid historical clearing
        identity were established. A historically closed financial year or period
        remains valid original evidence, never permission for a new posting.
        REVIEW_REQUIRED rows expose bounded reason codes and no partial source.
        Refund associations always require review; no first refund ID, rounding,
        inferred net formula or bank-match assumption is used. This endpoint makes
        no provider call, request/selection/write, bank confirmation, reconciliation,
        refund, fee, receipt or accounting mutation and returns no posting authority,
        credentials, provider binding, cursors, customer data or bank account details.
        Responses are private and must not be cached.
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: requestId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: schoolId, in: query, required: true, schema: { type: string, format: uuid } }
        - { name: page, in: query, schema: { type: integer, minimum: 0, maximum: 10000, default: 0 } }
        - { name: pageSize, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 25 } }
      responses:
        "200":
