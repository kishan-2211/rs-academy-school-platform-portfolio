  /payroll/accounting/reports/register:
    get:
      operationId: getPayrollRegister
      tags: [Payroll]
      summary: Read historical frozen salary records with current ledger-derived settlement status
      description: Requires payroll.read and accounting.read in the same active school scope. Audited, no-store, repeatable-read evidence. From/to are inclusive payroll-month first days; frozen values are preserved on reversed runs, whose current unsettled amount is zero. Unknown payment evidence has null amounts. Pages contain at most 100 rows and total matching count; never interpret one page as the complete report.
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: schoolId, in: query, schema: { type: string, format: uuid } }
        - { $ref: "#/components/parameters/PayrollReportFrom" }
        - { $ref: "#/components/parameters/PayrollReportTo" }
        - { $ref: "#/components/parameters/PayrollReportStaff" }
