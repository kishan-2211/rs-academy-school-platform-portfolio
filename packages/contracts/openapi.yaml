      type: object
      required: [schoolId, staffId, manualHandoffEnabled, canManage, roles, items]
      properties:
        schoolId: { type: string, format: uuid }
        staffId: { type: string, format: uuid }
        manualHandoffEnabled:
          type: boolean
          description: False by default; production handoff requires explicit operational approval.
        canManage: { type: boolean }
        roles:
          type: array
          items:
            type: object
            required: [code, name, capabilities]
            properties:
              code: { $ref: "#/components/schemas/StaffAccountInvitationRoleCode" }
