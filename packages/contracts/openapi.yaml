      operationId: repairVerifiedGatewayRefundJournal
      tags: [Finance]
      summary: Submit an accounting-only successor to an exact rejected or reversed refund journal
      description: >-
        Requires live school-scoped fees.refund, accounting.prepare and accounting.read,
        a secure browser session and matching CSRF. The selected prior batch/journal
        must still be the current rejected or reversed accounting for this completed
        refund. Restores no dues and issues no provider request. Reuses the one original
        immutable refund debit, frozen original mappings and allocation amounts. Target
        date must be non-future, no earlier than the economic/prior journal date, and
        inside an eligible open compatible accounting book/period. Original closed
        periods, gateway timestamps, receipt, economic date, collections and fee balance
        are unchanged; even a now-CLOSED original fee account is not reopened. One
        successor is permitted per predecessor, and its common journal is SUBMITTED
        for a distinct actual human's approval. Audit and replacement commit atomically.
        An authorized exact actor/client retry returns the retained replacement before
        rechecking mutable book eligibility, including after its target closes. Changed
        terms, stale predecessor or competing successor conflict. Unknown browser
        outcomes must retry the same immutable command, never issue another refund.
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: refundId, in: path, required: true, schema: { type: string, format: uuid } }
        - { $ref: "#/components/parameters/CsrfToken" }
