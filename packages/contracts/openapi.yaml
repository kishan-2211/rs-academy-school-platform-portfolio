    post:
      operationId: recordVerifiedGatewayRefundPosting
      tags: [Finance]
      summary: Record an already verified refund and restore original dues atomically
      description: >-
        Requires live fees.refund, accounting.prepare and accounting.read authority, school/object scope,
        browser session and CSRF. Does not execute an external refund. Requires retained
        nonconflicting verified successful refund evidence, original ACTIVE fee account,
        original posted payment accounting, and an eligible open posting day/book.
        CLOSED original accounts must first complete independent reviewed reopening;
        academic history never reactivates. Closed financial days are not reopened:
        posting may occur on a reviewed eligible later date while original provider
        timestamps and closed-day evidence remain preserved. The original receipt is
        unchanged. One original-account debit, balanced accounting submission and audit
        commit transactionally. Its journal awaits independent approval; returning money
        does not waive the fee. Same actor/clientRequestId with exact terms replays the
        retained result without another debit or journal. Changed terms or another
        posting for that refund conflict. Unknown browser outcomes require exact retry,
        not a fresh command. A later GET absence is not proof of a failed write.
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: refundId, in: path, required: true, schema: { type: string, format: uuid } }
        - { $ref: "#/components/parameters/CsrfToken" }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/GatewayRefundPostingCommand" } } }
      responses:
        "200":
          description: Retained verified-refund financial record with actual current journal status, not provider execution.
          headers: { Cache-Control: { schema: { type: string, const: "private, no-store" } }, Vary: { schema: { type: string } }, X-Content-Type-Options: { schema: { type: string, const: nosniff } } }
          content: { application/json: { schema: { $ref: "#/components/schemas/GatewayRefundPosting" } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
