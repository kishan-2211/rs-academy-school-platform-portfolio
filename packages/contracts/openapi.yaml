      description: >-
        Live school-scoped fees.read authority is required. READY is verified retained
        success, not proof of a posted refund. Current signed account balance excludes
        unposted evidence. POSTED carries a retained original-account debit and a
        separately stated accounting journal status; SUBMITTED is not general-ledger
