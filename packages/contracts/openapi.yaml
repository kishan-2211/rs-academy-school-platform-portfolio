        held for authorized reviewed posting on an eligible open date; the closed day and
        original evidence are never reopened or backdated. Successful responses are private,
        no-store, vary on Cookie and use no-referrer. Foreign or unavailable records are not
        enumerated through diagnostic details.
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: attemptId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Verified database payment state with an optional exact posted receipt, never a browser assertion of success.
          headers:
            Cache-Control: { schema: { type: string, const: "no-store, private" } }
            Vary: { description: "Includes Cookie; existing CORS processing may add its own vary fields.", schema: { type: string } }
            Referrer-Policy: { schema: { type: string, const: no-referrer } }
            X-Content-Type-Options: { schema: { type: string, const: nosniff } }
          content: { application/json: { schema: { $ref: "#/components/schemas/FamilyGatewayPayment" } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/FamilyGatewayServerError" }
  /family/children/{learnerId}/fee-payments/{attemptId}/continue:
    post:
      operationId: continueFamilyGatewayPayment
      tags: [Family portal, Finance]
      summary: Explicitly disclose the original secure hosted link to its initiating guardian
      description: >-
        An explicit user action, not an automatic return-page redirect. Requires the existing
        live HttpOnly session, portal.guardian, own-child scope and cookie/header CSRF pair.
        Only the original initiating guardian may continue. Under the finance fence the backend
        rechecks the active original account, current live grants, unexpired reservation, exact
        active provider/configuration binding and one unconflicted retained hosted link, with
        no blocking paid, pending-money or review evidence. canContinue in an earlier read is
        advisory and never bypasses this recheck. The original encrypted/AAD-bound link is
        validated against the exact allowed HTTPS provider host/path and its retained digest;
        successful disclosure is audited. No new CREATE call, capture, fee receipt, reservation
        release or payment-state authority is granted here. The private URL appears only in
        this successful continuation response, never status/history. Treat it as action-local:
        no browser persistence, prefetch, logging, analytics or implicit redirect. Responses
        are private/no-store, vary on Cookie and use Referrer-Policy no-referrer; the client
        navigates only after this explicit successful action.
      security: [{ sessionCookie: [] }]
      parameters:
        - { $ref: "#/components/parameters/LearnerId" }
        - { name: attemptId, in: path, required: true, schema: { type: string, format: uuid } }
        - { $ref: "#/components/parameters/CsrfToken" }
      responses:
        "200":
          description: The exact originally retained, newly reauthorized checkout URL; not a payment acknowledgement.
          headers:
            Cache-Control: { schema: { type: string, const: "no-store, private" } }
            Vary: { description: "Includes Cookie; existing CORS processing may add its own vary fields.", schema: { type: string } }
            Referrer-Policy: { schema: { type: string, const: no-referrer } }
            X-Content-Type-Options: { schema: { type: string, const: nosniff } }
          content: { application/json: { schema: { $ref: "#/components/schemas/FamilyGatewayContinuation" } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/FamilyGatewayServerError" }
