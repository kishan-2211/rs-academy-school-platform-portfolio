    GatewayRefundPostingCommand:
      type: object
      additionalProperties: false
      required: [schoolId, clientRequestId, financialYearId, postingOn, reason]
      properties:
        schoolId: { type: string, format: uuid }
        clientRequestId: { type: string, format: uuid, description: Stable per-actor command identity; exact retry retains original terms. }
        financialYearId: { type: string, format: uuid, description: Eligible independently opened matching-currency accounting book. }
        postingOn: { type: string, format: date, description: "Reviewed non-future open posting day, no earlier than original school refund day; never reopens a closed day." }
        reason: { type: string, minLength: 3, maxLength: 500, description: Reviewed reason without credentials or ISO control characters. }
    GatewayRefundPosting:
      type: object
      required: [id, refundId, paymentId, accountId, amount, currencyCode, postingOn, postedAt, ledgerEntryId, accountingBatchId, journalId, journalStatus]
      properties:
        id: { type: string, format: uuid }
        refundId: { type: string, format: uuid }
        paymentId: { type: string, format: uuid }
        accountId: { type: string, format: uuid, description: Original account only; no current-session transfer. }
        amount: { type: number, exclusiveMinimum: 0, multipleOf: 0.01, description: Verified amount restored to original dues exactly once. }
        currencyCode: { type: string, pattern: "^[A-Z]{3}$" }
        postingOn: { type: string, format: date }
        postedAt: { type: string, format: date-time, description: "Recorded-at timestamp, distinct from original gateway processed time." }
        ledgerEntryId: { type: string, format: uuid }
        accountingBatchId: { type: [string, "null"], format: uuid }
        journalId: { type: [string, "null"], format: uuid }
        journalStatus: { type: string, enum: [DRAFT, SUBMITTED, POSTED, REJECTED, REVERSED, REQUIRES_REVIEW], description: SUBMITTED awaits independent general-ledger approval. Later reversal/rejection never erases the economic refund or restores money twice. }
        journalFinancialYearId: { type: [string, "null"], format: uuid, description: "Current active-source journal book, which may differ from the original economic posting book after reviewed correction." }
        journalPostingOn: { type: [string, "null"], format: date, description: Current active-source accounting date. Never replaces the immutable economic postingOn date. }
    GatewayRefundJournalRepairCommand:
      type: object
      additionalProperties: false
      required: [schoolId, clientRequestId, expectedBatchId, expectedJournalId, financialYearId, postingOn, reason]
      properties:
        schoolId: { type: string, format: uuid }
        clientRequestId: { type: string, format: uuid, description: Stable exact command identity; never replaced after an unknown outcome. }
        expectedBatchId: { type: string, format: uuid, description: Exact current rejected/reversed original refund accounting batch. }
        expectedJournalId: { type: string, format: uuid, description: Exact journal linked by the selected predecessor batch. }
        financialYearId: { type: string, format: uuid }
        postingOn: { type: string, format: date, description: Reviewed open accounting date only; economic dates remain unchanged. }
        reason: { type: string, minLength: 3, maxLength: 500 }
    GatewayRefundJournalRepair:
      type: object
      required: [refundPostingId, refundId, previousBatchId, previousJournalId, accountingBatchId, journalId, journalStatus, financialYearId, postingOn]
      properties:
        refundPostingId: { type: string, format: uuid, description: "The existing economic completion, not a new refund." }
        refundId: { type: string, format: uuid }
        previousBatchId: { type: string, format: uuid }
        previousJournalId: { type: string, format: uuid }
        accountingBatchId: { type: string, format: uuid }
        journalId: { type: string, format: uuid }
        journalStatus: { type: string, enum: [SUBMITTED, POSTED, REJECTED, REVERSED] }
        financialYearId: { type: string, format: uuid }
        postingOn: { type: string, format: date }
    GatewayRefundPostingContext:
      type: object
      required: [schoolId, refundId, paymentId, receiptNumber, accountId, learnerName, academicSessionName, accountStatus, currencyCode, balance, verifiedRefundAmount, sourceState, processedAtExact, processedOn, schoolTimeZone, originalDayClosed, canPost, posting]
      properties:
        schoolId: { type: string, format: uuid }
        refundId: { type: string, format: uuid }
        paymentId: { type: string, format: uuid }
        receiptNumber: { type: string, description: Unchanged original numbered receipt. }
        accountId: { type: string, format: uuid }
        learnerName: { type: string }
        academicSessionName: { type: string }
        accountStatus: { type: string, enum: [ACTIVE, CLOSED] }
        currencyCode: { type: string, pattern: "^[A-Z]{3}$" }
        balance: { type: number, multipleOf: 0.01, description: Actual signed original-account ledger balance; excludes unposted refund holds. }
        verifiedRefundAmount: { type: [number, "null"], exclusiveMinimum: 0, multipleOf: 0.01 }
        sourceState: { type: string, enum: [READY, NO_VERIFIED_SUCCESS, REVIEW_REQUIRED, POSTED] }
        processedAtExact: { type: [string, "null"], format: date-time, description: Exact preserved original gateway refund timestamp. }
        processedOn: { type: [string, "null"], format: date }
        schoolTimeZone: { type: [string, "null"] }
        originalDayClosed: { type: boolean, description: "Original financial-day closure evidence is retained, never reopened." }
        canPost: { type: boolean, description: Current presentation hint only; server revalidates all live authority and source/book/account invariants. }
        canRepairJournal: { type: boolean, default: false, description: Presentation hint for a current rejected/reversed accounting-only repair. Server revalidates exact predecessor and live scoped authority. }
        posting:
          oneOf: [{ $ref: "#/components/schemas/GatewayRefundPosting" }, { type: "null" }]
    GatewayRefundStatus:
      type: string
      enum: [SUBMITTED, APPROVED, REJECTED, CANCELLED]
      description: Human intent/review state only; APPROVED is not a completed provider refund or financial posting.
    GatewaySettlementReportedMoney:
      type: [string, "null"]
      maxLength: 19
      pattern: '^-?(?:(?:0|[1-9][0-9]{0,7})(?:\.[0-9]{1,8})?|100000000(?:\.0{1,8})?)$'
      description: Exact provider-reported decimal with absolute value at most 100000000 and up to eight fractional places, retaining scale. Null means unreported, never zero. Not posted paise or bank cash.
    GatewaySettlementSubmit:
      type: object
      additionalProperties: false
      required: [schoolId, clientRequestId, schoolTimeZone, kind]
      properties:
        schoolId: { type: string, format: uuid }
        clientRequestId: { type: string, format: uuid, description: Retain this identity and exact terms across uncertain submission retries. }
        schoolTimeZone: { type: string, minLength: 1, maxLength: 60, description: Exact currently displayed canonical school zone; frozen in the new request. }
        kind: { type: string, enum: [SUMMARY, EVENTS] }
        from: { type: [string, "null"], format: date-time }
        until: { type: [string, "null"], format: date-time }
        sourceSummaryReadId: { type: [string, "null"], format: uuid }
        settlementReference: { type: [string, "null"], maxLength: 100, pattern: '^[A-Za-z0-9][A-Za-z0-9_-]{0,99}$' }
      oneOf:
        - required: [from, until]
          properties:
            kind: { const: SUMMARY }
            from: { type: string, format: date-time }
            until: { type: string, format: date-time }
            sourceSummaryReadId: { type: "null" }
            settlementReference: { type: "null" }
        - required: [sourceSummaryReadId, settlementReference]
          properties:
            kind: { const: EVENTS }
            from: { type: "null" }
            until: { type: "null" }
            sourceSummaryReadId: { type: string, format: uuid }
            settlementReference: { type: string }
    GatewaySettlementResult:
      type: object
      additionalProperties: false
      required: [id, schoolId, kind]
      properties:
        id: { type: string, format: uuid }
        schoolId: { type: string, format: uuid }
        kind: { type: string, enum: [SUMMARY, EVENTS] }
    GatewaySettlementRequest:
      type: object
      additionalProperties: false
      required: [id, kind, schoolTimeZone, status, from, until, sourceSummaryReadId, settlementReference, requestedAt, requestedBy, pagesCompleted, pagesPending, pagesReview, lastCheckedAt, nextCheckAt]
      properties:
        id: { type: string, format: uuid }
        kind: { type: string, enum: [SUMMARY, EVENTS] }
        schoolTimeZone: { type: string, minLength: 1, maxLength: 60 }
        status: { type: string, enum: [REQUESTED, SYNCING, RETRYING, COMPLETE, REVIEW_REQUIRED], description: "COMPLETE is a complete selected requested report chain, not bank reconciliation or financial posting." }
        from: { type: [string, "null"], format: date-time }
        until: { type: [string, "null"], format: date-time }
        sourceSummaryReadId: { type: [string, "null"], format: uuid }
        settlementReference: { type: [string, "null"], maxLength: 100 }
        requestedAt: { type: string, format: date-time }
        requestedBy: { type: string, maxLength: 320 }
        pagesCompleted: { type: integer, minimum: 0, maximum: 1000 }
        pagesPending: { type: integer, minimum: 0, maximum: 1000 }
        pagesReview: { type: integer, minimum: 0, maximum: 1000 }
        lastCheckedAt: { type: [string, "null"], format: date-time, description: Latest retained UNKNOWN or COMPLETE read observation in this exact scoped requested chain. }
        nextCheckAt: { type: [string, "null"], format: date-time }
    GatewaySettlementQueue:
      type: object
      additionalProperties: false
      required: [schoolId, schoolTimeZone, syncEnabled, canSync, status, kind, query, page, pageSize, total, hasMore, items]
      properties:
        schoolId: { type: string, format: uuid }
        schoolTimeZone: { type: string, minLength: 1, maxLength: 60 }
        syncEnabled: { type: boolean, description: Exactly one eligible configured/active exclusive school route; not credential availability or activation approval. }
        canSync: { type: boolean, description: Requires syncEnabled and actual live request authority; POST independently reauthorizes. }
        status: { type: string, enum: [ALL, REQUESTED, SYNCING, RETRYING, COMPLETE, REVIEW_REQUIRED] }
        kind: { type: string, enum: [ALL, SUMMARY, EVENTS] }
        query: { type: string, maxLength: 100, description: "Normalized literal filter; absent/blank is the empty string, not null." }
        page: { type: integer, minimum: 0, maximum: 10000 }
        pageSize: { type: integer, minimum: 1, maximum: 50 }
        total: { type: integer, format: int64, minimum: 0 }
        hasMore: { type: boolean }
        items: { type: array, maxItems: 50, x-unique-by: id, items: { $ref: "#/components/schemas/GatewaySettlementRequest" } }
    GatewaySettlementSummary:
      type: object
      additionalProperties: false
      required: [settlementReference, reportedStatus, transferReference, paymentsFrom, paymentsThrough, initiatedAt, processedAt, reportedPaymentAmount, reportedServiceCharge, reportedServiceTax, reportedAdjustment, reportedSettlementCharge, reportedSettlementTax, reportedSplitCharge, reportedSplitTax, reportedVendorCommission, reportedAmountSettled, reportedChargeType, reportedSettlementType]
      description: Minimal provider-reported summary. No summary currency or universal net formula is assumed; this is not matched bank cash.
      properties:
        settlementReference: { type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9_-]{0,99}$' }
        reportedStatus: { type: string, pattern: '^[A-Z][A-Z0-9_]{0,59}$' }
        transferReference: { type: [string, "null"], maxLength: 120, pattern: '^[A-Za-z0-9][A-Za-z0-9_.:/\-]{0,119}$' }
        paymentsFrom: { type: [string, "null"], format: date-time }
        paymentsThrough: { type: [string, "null"], format: date-time }
        initiatedAt: { type: [string, "null"], format: date-time }
        processedAt: { type: [string, "null"], format: date-time }
        reportedPaymentAmount: { $ref: "#/components/schemas/GatewaySettlementReportedMoney" }
        reportedServiceCharge: { $ref: "#/components/schemas/GatewaySettlementReportedMoney" }
        reportedServiceTax: { $ref: "#/components/schemas/GatewaySettlementReportedMoney" }
        reportedAdjustment: { $ref: "#/components/schemas/GatewaySettlementReportedMoney" }
        reportedSettlementCharge: { $ref: "#/components/schemas/GatewaySettlementReportedMoney" }
        reportedSettlementTax: { $ref: "#/components/schemas/GatewaySettlementReportedMoney" }
        reportedSplitCharge: { $ref: "#/components/schemas/GatewaySettlementReportedMoney" }
        reportedSplitTax: { $ref: "#/components/schemas/GatewaySettlementReportedMoney" }
        reportedVendorCommission: { $ref: "#/components/schemas/GatewaySettlementReportedMoney" }
        reportedAmountSettled: { $ref: "#/components/schemas/GatewaySettlementReportedMoney" }
        reportedChargeType: { type: [string, "null"], pattern: '^[A-Z][A-Z0-9_]{0,59}$' }
        reportedSettlementType: { type: [string, "null"], pattern: '^[A-Z][A-Z0-9_]{0,59}$' }
    GatewaySettlementEvent:
      type: object
      additionalProperties: false
      required: [settlementReference, eventReference, reportedType, reportedDirection, reportedStatus, currencyCode, reportedAmount, reportedServiceCharge, reportedServiceTax, reportedSettlementAmount, occurredAt, orderReference, paymentReference, refundReferences, chargesCurrencyCode]
      properties:
        settlementReference: { type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9_-]{0,99}$' }
        eventReference: { type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9_-]{0,99}$', description: Not a globally unique economic event key; repeated IDs across physical rows/types are retained. }
        reportedType: { type: string, pattern: '^[A-Z][A-Z0-9_]{0,59}$' }
        reportedDirection: { type: string, pattern: '^[A-Z][A-Z0-9_]{0,59}$' }
        reportedStatus: { type: string, pattern: '^[A-Z][A-Z0-9_]{0,59}$' }
        currencyCode: { type: string, pattern: '^[A-Z]{3}$', description: Actual reported currency; unexpected currencies are not relabelled INR. }
        reportedAmount: { allOf: [{ $ref: "#/components/schemas/GatewaySettlementReportedMoney" }, { type: string }] }
        reportedServiceCharge: { $ref: "#/components/schemas/GatewaySettlementReportedMoney" }
        reportedServiceTax: { $ref: "#/components/schemas/GatewaySettlementReportedMoney" }
        reportedSettlementAmount: { $ref: "#/components/schemas/GatewaySettlementReportedMoney" }
        occurredAt: { type: string, format: date-time }
        orderReference: { type: [string, "null"], pattern: '^[A-Za-z0-9][A-Za-z0-9_-]{0,99}$' }
        paymentReference: { type: [string, "null"], pattern: '^[A-Za-z0-9][A-Za-z0-9_-]{0,99}$' }
        refundReferences: { type: array, maxItems: 100, items: { type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9_-]{0,99}$' } }
        chargesCurrencyCode: { type: [string, "null"], pattern: '^[A-Z]{3}$' }
    GatewaySettlementRow:
      type: object
      additionalProperties: false
      required: [sourceReadId, rowIndex, observedAt, summary, event]
      properties:
        sourceReadId: { type: string, format: uuid }
        rowIndex: { type: integer, minimum: 0, maximum: 9, description: Zero-based physical position in its independently retained page. }
        observedAt: { type: string, format: date-time }
        summary: { anyOf: [{ $ref: "#/components/schemas/GatewaySettlementSummary" }, { type: "null" }] }
        event: { anyOf: [{ $ref: "#/components/schemas/GatewaySettlementEvent" }, { type: "null" }] }
      oneOf:
        - properties: { summary: { type: object }, event: { type: "null" } }
        - properties: { summary: { type: "null" }, event: { type: object } }
    GatewaySettlementReport:
      type: object
      additionalProperties: false
      required: [schoolId, request, query, page, pageSize, total, hasMore, items]
      properties:
        schoolId: { type: string, format: uuid }
        request: { $ref: "#/components/schemas/GatewaySettlementRequest" }
        query: { type: string, maxLength: 100 }
        page: { type: integer, minimum: 0, maximum: 10000 }
        pageSize: { type: integer, minimum: 1, maximum: 50 }
        total: { type: integer, format: int64, minimum: 0 }
        hasMore: { type: boolean }
        items: { type: array, maxItems: 50, items: { $ref: "#/components/schemas/GatewaySettlementRow" }, description: "Physical identity is the sourceReadId/rowIndex pair, not eventReference alone." }
    GatewaySettlementBankCommand:
      type: object
      additionalProperties: false
      required: [schoolId, clientRequestId, bankAccountId, currencyCode, creditedAmount, actualCreditedAt, verificationKind, bankCreditReference, confirmedReceived, reason]
      properties:
        schoolId: { type: string, format: uuid }
        clientRequestId: { type: string, format: uuid }
        bankAccountId: { type: string, format: uuid }
        currencyCode: { type: string, const: INR }
        creditedAmount:
          type: string
          maxLength: 12
          pattern: '^(?:(?:0|[1-9][0-9]{0,7})(?:\.[0-9]{1,2})?|100000000(?:\.0{1,2})?)$'
          not: { enum: ['0', '0.0', '0.00'] }
          description: Exact positive INR paise, at most 100000000.00; never rounded.
        actualCreditedAt: { type: string, format: date-time, description: Known nonfuture actual bank credit instant; canonical full UTC precision is retained separately from its floor-microsecond projection. }
        verificationKind: { type: string, enum: [BANK_APP_CREDIT, BANK_STATEMENT_CREDIT] }
        bankCreditReference: { type: string, minLength: 1, maxLength: 120, description: "Bounded original ASCII bank reference, not a URL; normalization removes ASCII whitespace and uppercases without removing meaningful punctuation." }
        confirmedReceived: { type: boolean, const: true }
        reason: { type: string, minLength: 3, maxLength: 240, description: Safe trimmed review reason without control characters. }
    GatewaySettlementBankRejectionCommand:
      type: object
      additionalProperties: false
      required: [schoolId, clientRequestId, reason, confirmedMistakenEvidence]
      properties:
        schoolId: { type: string, format: uuid }
        clientRequestId: { type: string, format: uuid }
        reason: { type: string, minLength: 3, maxLength: 240 }
        confirmedMistakenEvidence: { type: boolean, const: true }
    GatewaySettlementBankReviewReason:
      type: string
      enum: [NOT_RECONCILED, SUMMARY_CURRENCY_UNCONFIRMED, SOURCE_RECONCILIATION_PENDING, SUMMARY_AMOUNT_UNKNOWN, SUMMARY_AMOUNT_MISMATCH, TRANSFER_REFERENCE_UNKNOWN, TRANSFER_REFERENCE_MISMATCH, SUMMARY_STATUS_REVIEW]
    GatewaySettlementBankSummary:
      type: object
      additionalProperties: false
      required: [sourceReadId, rowIndex, observedAt, reportedStatus, transferReference, reportedAmountSettled]
      properties:
        sourceReadId: { type: string, format: uuid }
        rowIndex: { type: integer, minimum: 0, maximum: 9 }
        observedAt: { type: string, format: date-time }
        reportedStatus: { type: string }
        transferReference: { type: [string, 'null'], maxLength: 120 }
        reportedAmountSettled: { $ref: '#/components/schemas/GatewaySettlementReportedMoney' }
    GatewaySettlementBankAccount:
      type: object
      additionalProperties: false
      required: [id, code, name, currencyCode]
      properties:
        id: { type: string, format: uuid }
        code: { type: string, maxLength: 100 }
        name: { type: string, maxLength: 200 }
        currencyCode: { type: string, const: INR }
    GatewaySettlementBankRejection:
      type: object
      additionalProperties: false
      required: [id, reason, rejectedAt, rejectedBy]
      properties:
        id: { type: string, format: uuid }
        reason: { type: string, minLength: 3, maxLength: 240 }
        rejectedAt: { type: string, format: date-time }
        rejectedBy: { type: string }
    GatewaySettlementBankEvidence:
      type: object
      additionalProperties: false
      required: [id, clientRequestId, bankAccountId, bankReference, currencyCode, creditedAmount, actualCreditedAt, creditedOn, verificationKind, recordedAt, recordedBy, reason, status, reviewReasons, rejection, canReject]
      description: Original bank attestation remains immutable after rejection. Always NOT_RECONCILED, SUMMARY_CURRENCY_UNCONFIRMED and SOURCE_RECONCILIATION_PENDING. No money is posted or reversed.
      properties:
        id: { type: string, format: uuid }
        clientRequestId: { type: string, format: uuid }
        bankAccountId: { type: string, format: uuid }
        bankReference: { type: string, minLength: 1, maxLength: 120 }
        currencyCode: { type: string, const: INR }
        creditedAmount: { type: string, pattern: '^(?:(?:0|[1-9][0-9]{0,7})\.[0-9]{2}|100000000\.00)$', not: { const: '0.00' } }
        actualCreditedAt: { type: string, format: date-time, maxLength: 30, description: "Original canonical UTC instant with full source nanoseconds retained, supported proleptic years 0001 through 9999." }
        creditedOn: { type: string, format: date, description: "Derived from the original instant in the frozen report school timezone, never the browser timezone." }
        verificationKind: { type: string, enum: [BANK_APP_CREDIT, BANK_STATEMENT_CREDIT] }
        recordedAt: { type: string, format: date-time }
        recordedBy: { type: string }
        reason: { type: string, minLength: 3, maxLength: 240 }
        status: { type: string, enum: [BANK_EVIDENCE_RECORDED, REJECTED] }
        reviewReasons: { type: array, minItems: 3, maxItems: 8, uniqueItems: true, items: { $ref: '#/components/schemas/GatewaySettlementBankReviewReason' } }
        rejection: { anyOf: [{ $ref: '#/components/schemas/GatewaySettlementBankRejection' }, { type: 'null' }] }
        canReject: { type: boolean, description: Current authority and unconsumed-evidence hint on the live bank surface; frozen preparation detail retains its original observed value and never grants current action authority. }
      oneOf:
        - properties: { status: { const: BANK_EVIDENCE_RECORDED }, rejection: { type: 'null' } }
        - properties: { status: { const: REJECTED }, rejection: { type: object }, canReject: { const: false } }
    GatewaySettlementBankContext:
      type: object
      additionalProperties: false
      required: [schoolId, requestId, settlementReference, schoolTimeZone, canRecord, canReject, summary, bankAccounts, evidence, hasMoreEvidence]
      properties:
        schoolId: { type: string, format: uuid }
        requestId: { type: string, format: uuid }
        settlementReference: { type: string, maxLength: 100 }
        schoolTimeZone: { type: string, maxLength: 60 }
        canRecord: { type: boolean }
        canReject: { type: boolean }
        summary: { $ref: '#/components/schemas/GatewaySettlementBankSummary' }
        bankAccounts: { type: array, maxItems: 1000, items: { $ref: '#/components/schemas/GatewaySettlementBankAccount' } }
        evidence: { type: array, maxItems: 25, items: { $ref: '#/components/schemas/GatewaySettlementBankEvidence' } }
        hasMoreEvidence: { type: boolean }
    GatewaySettlementComponentKey:
      type: string
      enum: [SERVICE_CHARGE, SERVICE_TAX, ADJUSTMENT, SETTLEMENT_CHARGE, SETTLEMENT_TAX, SPLIT_CHARGE, SPLIT_TAX, VENDOR_COMMISSION]
    GatewaySettlementComponentReview:
      type: object
      additionalProperties: false
      required: [key, mode, direction, postedAmount, reason]
      description: >-
        One explicitly reviewed component, including zero. Amount is an absolute exact
        paise value, at most 100000000.00. Nonzero requires a scoped eligible account and
        evidence reference; zero requires null account. REPORTED equals the selected
        known reported absolute amount without rounding. ROUNDING_REVIEW documents a
        nonzero difference below 0.01 and requires a reference. CONFIRMED_ZERO explicitly
        reviews a known zero or unreported amount; EXTERNAL_REVIEW requires an unreported
        amount, positive posted value and external evidence. Missing is never silently
        zero. Known non-adjustment charge sign fixes direction; ADJUSTMENT is explicitly
        reviewed. References/reasons are bounded text without control characters or URLs.
      properties:
        key: { $ref: '#/components/schemas/GatewaySettlementComponentKey' }
        mode: { type: string, enum: [REPORTED, ROUNDING_REVIEW, CONFIRMED_ZERO, EXTERNAL_REVIEW] }
        direction: { type: string, enum: [DEBIT, CREDIT] }
        accountId: { type: [string, 'null'], format: uuid }
        postedAmount: { type: string, maxLength: 16, pattern: '^(?:(?:0|[1-9][0-9]{0,7})(?:\.[0-9]{1,2})?|100000000(?:\.0{1,2})?)$' }
        evidenceReference: { type: [string, 'null'], maxLength: 120 }
        reason: { type: string, minLength: 3, maxLength: 240 }
      oneOf:
        - properties: { postedAmount: { enum: ['0', '0.0', '0.00'] }, accountId: { type: 'null' } }
        - required: [accountId, evidenceReference]
          properties:
            postedAmount: { not: { enum: ['0', '0.0', '0.00'] } }
            accountId: { type: string }
            evidenceReference: { type: string, minLength: 1 }
    GatewaySettlementRefundAssociation:
      type: object
      additionalProperties: false
      required: [sourceReadId, rowIndex, refundPostingId, reason]
      description: Explicit association to one retained physical refund event and one completed refund posting, never an automatic amount/reference match. Each row and completion may occur only once in an attempt.
      properties:
        sourceReadId: { type: string, format: uuid }
        rowIndex: { type: integer, minimum: 0, maximum: 9 }
        refundPostingId: { type: string, format: uuid }
        reason: { type: string, minLength: 3, maxLength: 240 }
    GatewaySettlementPreparationCommand:
      type: object
      additionalProperties: false
      required: [schoolId, clientRequestId, contextFingerprint, bankEvidenceId, financialYearId, postingOn, summaryCurrencyCode, confirmedSummaryCurrency, componentBasis, componentReviews, refundAssociations, confirmedReviewed, reason]
      properties:
        schoolId: { type: string, format: uuid }
        clientRequestId: { type: string, format: uuid, description: Keep the exact identity and reviewed terms for uncertain retries; scoped to the actual human and school. }
        contextFingerprint: { type: string, pattern: '^[a-f0-9]{64}$', description: "Fresh server context fingerprint for the whole retained statement, not just a visible page." }
        bankEvidenceId: { type: string, format: uuid }
        financialYearId: { type: string, format: uuid }
        postingOn: { type: string, format: date }
        summaryCurrencyCode: { type: string, const: INR }
        confirmedSummaryCurrency: { type: boolean, const: true, description: The provider summary has no invented currency; the human explicitly confirms INR. }
        componentBasis: { type: string, enum: [SUMMARY, EVENTS], description: Chooses aggregate service charge/tax once; the other six components use summary facts. EVENTS requires complete INR charge facts from every retained event. }
        componentReviews: { type: array, minItems: 8, maxItems: 8, x-unique-by: key, items: { $ref: '#/components/schemas/GatewaySettlementComponentReview' }, description: Exactly one review for each of the eight component keys. }
        refundAssociations: { type: array, maxItems: 10000, items: { $ref: '#/components/schemas/GatewaySettlementRefundAssociation' } }
        previousPreparationId: { type: [string, 'null'], format: uuid, description: Latest retained REJECTED or REVERSED attempt for a same-root repair; null for a new root. }
        confirmedReviewed: { type: boolean, const: true }
        reason: { type: string, minLength: 3, maxLength: 240 }
    GatewaySettlementAbandonmentCommand:
      type: object
      additionalProperties: false
      required: [schoolId, clientRequestId, reason, confirmedReleaseRejectedPreparation]
      properties:
        schoolId: { type: string, format: uuid }
        clientRequestId: { type: string, format: uuid }
        reason: { type: string, minLength: 3, maxLength: 240 }
        confirmedReleaseRejectedPreparation: { type: boolean, const: true }
    GatewaySettlementComponentFact:
      type: object
      additionalProperties: false
      required: [key, summaryAmount, eventsAmount, eventsComplete]
      description: Exact original signed summary and complete aggregate event facts with up to eight decimals. Null means unreported or incomplete, never zero. Only service charge/tax have event aggregates.
      properties:
        key: { $ref: '#/components/schemas/GatewaySettlementComponentKey' }
        summaryAmount: { $ref: '#/components/schemas/GatewaySettlementReportedMoney' }
        eventsAmount: { type: [string, 'null'], pattern: '^-?(0|[1-9][0-9]*)(\.[0-9]{1,8})?$' }
        eventsComplete: { type: boolean }
      oneOf:
        - properties: { eventsComplete: { const: true }, eventsAmount: { type: string } }
        - properties: { eventsComplete: { const: false }, eventsAmount: { type: 'null' } }
    GatewaySettlementFinancialYear:
      type: object
      additionalProperties: false
      required: [id, code, name, startsOn, endsOn, accountingBasis, currencyCode]
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        name: { type: string }
        startsOn: { type: string, format: date }
        endsOn: { type: string, format: date }
        accountingBasis: { type: string, enum: [CASH, ACCRUAL] }
        currencyCode: { type: string, const: INR }
    GatewaySettlementAccountOption:
      type: object
      additionalProperties: false
      required: [id, code, name, accountType, category]
      description: Minimal active direct-postable scoped chart identity. Selection is not financial admission; the server rechecks exact account use, date and source compatibility.
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        name: { type: string }
        accountType: { type: string, enum: [ASSET, LIABILITY, EQUITY, INCOME, EXPENSE] }
        category: { type: string }
    GatewaySettlementAccountingOptions:
      type: object
      additionalProperties: false
      required: [canPrepare, financialYears, accounts]
      properties:
        canPrepare: { type: boolean, description: "Current scoped accounting.prepare authority hint only; does not imply an eligible year, open period or valid journal exists." }
        financialYears: { type: array, items: { $ref: '#/components/schemas/GatewaySettlementFinancialYear' } }
        accounts: { type: array, items: { $ref: '#/components/schemas/GatewaySettlementAccountOption' } }
    GatewaySettlementPreparationRow:
      type: object
      additionalProperties: false
      required: [sourceReadId, rowIndex, event, status, reasons, source]
      properties:
        sourceReadId: { type: string, format: uuid }
        rowIndex: { type: integer, minimum: 0, maximum: 9 }
        event: { $ref: '#/components/schemas/GatewaySettlementEvent' }
        status: { type: string, enum: [PAYMENT_SOURCE_IDENTIFIED, REFUND_SELECTION_REQUIRED, REVIEW_REQUIRED] }
        reasons: { type: array, items: { $ref: '#/components/schemas/GatewaySettlementSourceReviewReason' } }
        source: { anyOf: [{ $ref: '#/components/schemas/GatewaySettlementSourceReviewSource' }, { type: 'null' }] }
      oneOf:
        - properties: { status: { const: PAYMENT_SOURCE_IDENTIFIED }, source: { type: object }, reasons: { maxItems: 0 } }
        - properties: { status: { const: REFUND_SELECTION_REQUIRED }, source: { type: 'null' }, reasons: { minItems: 1 } }
        - properties: { status: { const: REVIEW_REQUIRED }, source: { type: 'null' }, reasons: { minItems: 1 } }
    GatewaySettlementPreparationBlocker:
      type: string
      enum: [SOURCE_REVIEW_REQUIRED, NO_EVENTS, SUMMARY_STATUS_REVIEW_REQUIRED, SUMMARY_AMOUNT_UNAVAILABLE, SUMMARY_FRACTIONAL_PAISE, NO_OPEN_ACCOUNTING_YEAR, NO_AVAILABLE_BANK_EVIDENCE, STATEMENT_ALREADY_PREPARED]
    GatewaySettlementPreparationContext:
      type: object
      additionalProperties: false
      required: [schoolId, requestId, settlementReference, schoolTimeZone, contextFingerprint, canPrepare, accountingOptions, bankEvidence, summary, componentFacts, paymentTotal, refundTotal, page, pageSize, totalEvents, totalRefundEvents, hasMore, rows, blockers, preparations]
      properties:
        schoolId: { type: string, format: uuid }
        requestId: { type: string, format: uuid }
        settlementReference: { type: string, maxLength: 100 }
        schoolTimeZone: { type: string, maxLength: 60 }
        contextFingerprint: { type: string, pattern: '^[a-f0-9]{64}$' }
        canPrepare: { type: boolean, description: "Current finance/accounting preparation authority hint, independent of blockers. Never a guarantee of admissible money or a permission to post." }
        accountingOptions: { $ref: '#/components/schemas/GatewaySettlementAccountingOptions' }
        bankEvidence: { type: array, maxItems: 25, items: { $ref: '#/components/schemas/GatewaySettlementBankEvidence' } }
        summary: { $ref: '#/components/schemas/GatewaySettlementSummary' }
        componentFacts: { type: array, minItems: 8, maxItems: 8, x-unique-by: key, items: { $ref: '#/components/schemas/GatewaySettlementComponentFact' } }
        paymentTotal: { type: [string, 'null'], pattern: '^(0|[1-9][0-9]*)\.[0-9]{2}$', description: Whole-statement gross payment amount; null if any source needs review. }
        refundTotal: { type: [string, 'null'], pattern: '^(0|[1-9][0-9]*)\.[0-9]{2}$', description: Whole-statement gross refund event amount; explicit historical associations still required. }
        page: { type: integer, minimum: 0, maximum: 10000 }
        pageSize: { type: integer, minimum: 1, maximum: 50 }
        totalEvents: { type: integer, format: int64, minimum: 0, maximum: 10000 }
        totalRefundEvents: { type: integer, format: int64, minimum: 0, maximum: 10000 }
        hasMore: { type: boolean }
        rows: { type: array, maxItems: 50, items: { $ref: '#/components/schemas/GatewaySettlementPreparationRow' } }
        blockers: { type: array, uniqueItems: true, items: { $ref: '#/components/schemas/GatewaySettlementPreparationBlocker' } }
        preparations: { type: array, maxItems: 25, items: { $ref: '#/components/schemas/GatewaySettlementPreparation' }, description: "Latest retained attempts for this request, ordered newest first." }
    GatewaySettlementPreparation:
      type: object
      additionalProperties: false
      required: [id, clientRequestId, rootId, requestId, bankEvidenceId, revision, previousPreparationId, journalId, status, rowVersion, voucherNumber, postingOn, currencyCode, bankAmount, paymentTotal, refundTotal, componentDebitTotal, componentCreditTotal, sourceCount, preparedAt, preparedBy, reason]
      description: Immutable reviewed attempt plus current common-journal state. ABANDONED means an independently rejected never-posted root explicitly released reservations; reversal alone never releases them. All monetary fields are exact two-decimal strings.
      properties:
        id: { type: string, format: uuid }
        clientRequestId: { type: string, format: uuid }
        rootId: { type: string, format: uuid }
        requestId: { type: string, format: uuid }
        bankEvidenceId: { type: string, format: uuid }
        revision: { type: integer, minimum: 1 }
        previousPreparationId: { type: [string, 'null'], format: uuid }
        journalId: { type: string, format: uuid }
        status: { type: string, enum: [SUBMITTED, POSTED, REJECTED, REVERSED, ABANDONED] }
        rowVersion: { type: integer, format: int64, minimum: 1, description: Current common-journal optimistic concurrency version. }
        voucherNumber: { type: [string, 'null'], description: Allocated only by an independently posted common journal; null while submitted or rejected. }
        postingOn: { type: string, format: date }
        currencyCode: { type: string, const: INR }
        bankAmount: { type: string, pattern: '^(0|[1-9][0-9]*)\.[0-9]{2}$', not: { const: '0.00' } }
        paymentTotal: { type: string, pattern: '^(0|[1-9][0-9]*)\.[0-9]{2}$' }
        refundTotal: { type: string, pattern: '^(0|[1-9][0-9]*)\.[0-9]{2}$' }
        componentDebitTotal: { type: string, pattern: '^(0|[1-9][0-9]*)\.[0-9]{2}$' }
        componentCreditTotal: { type: string, pattern: '^(0|[1-9][0-9]*)\.[0-9]{2}$' }
        sourceCount: { type: integer, minimum: 1, maximum: 10000 }
        preparedAt: { type: string, format: date-time }
        preparedBy: { type: string }
        reason: { type: string, minLength: 3, maxLength: 240 }
    GatewaySettlementPreparationSourceIdentity:
      type: object
      additionalProperties: false
      required: [kind, paymentId, refundPostingId, feeLedgerEntryId, postingItemId, postingBatchId, accountingJournalId, clearingAccountId, amount, sourceReadId, rowIndex, associationReason]
      description: Frozen economic claim and original physical source. PAYMENT uniqueness uses paymentId; REFUND uniqueness uses completion refundPostingId, allowing distinct partial refunds of the same payment. Journal identity is historical proof, never an economic uniqueness substitute.
      properties:
        kind: { type: string, enum: [PAYMENT, REFUND] }
        paymentId: { type: string, format: uuid }
        refundPostingId: { type: [string, 'null'], format: uuid }
        feeLedgerEntryId: { type: string, format: uuid }
        postingItemId: { type: string, format: uuid }
        postingBatchId: { type: string, format: uuid }
        accountingJournalId: { type: string, format: uuid }
        clearingAccountId: { type: string, format: uuid }
        amount: { type: string, pattern: '^(0|[1-9][0-9]*)\.[0-9]{2}$', not: { const: '0.00' } }
        sourceReadId: { type: string, format: uuid }
        rowIndex: { type: integer, minimum: 0, maximum: 9 }
        associationReason: { type: [string, 'null'], minLength: 3, maxLength: 240 }
      oneOf:
        - properties: { kind: { const: PAYMENT }, refundPostingId: { type: 'null' }, associationReason: { type: 'null' } }
        - properties: { kind: { const: REFUND }, refundPostingId: { type: string }, associationReason: { type: string } }
    GatewaySettlementPreparationDetail:
      type: object
      additionalProperties: false
      required: [preparation, schoolTimeZone, summary, bankEvidence, componentBasis, componentFacts, componentReviews, refundAssociations, sources]
      description: Reviewed evidence is retained for this exact attempt and never recalculated from a newer report. Nested bank evidence action hints are frozen observations; use the live bank/preparation context for current authority. No raw provider payload, internal evidence snapshot/hash or credentials.
      properties:
        preparation: { $ref: '#/components/schemas/GatewaySettlementPreparation' }
        schoolTimeZone: { type: string, maxLength: 60 }
        summary: { $ref: '#/components/schemas/GatewaySettlementSummary' }
        bankEvidence: { $ref: '#/components/schemas/GatewaySettlementBankEvidence' }
        componentBasis: { type: string, enum: [SUMMARY, EVENTS] }
        componentFacts: { type: array, minItems: 8, maxItems: 8, x-unique-by: key, items: { $ref: '#/components/schemas/GatewaySettlementComponentFact' } }
        componentReviews: { type: array, minItems: 8, maxItems: 8, x-unique-by: key, items: { $ref: '#/components/schemas/GatewaySettlementComponentReview' } }
        refundAssociations: { type: array, maxItems: 10000, items: { $ref: '#/components/schemas/GatewaySettlementRefundAssociation' } }
        sources: { type: array, minItems: 1, maxItems: 10000, items: { $ref: '#/components/schemas/GatewaySettlementPreparationSourceIdentity' } }
    GatewaySettlementAbandonmentResult:
      type: object
      additionalProperties: false
      required: [clientRequestId, preparation]
      properties:
        clientRequestId: { type: string, format: uuid, description: "Original abandonment client identity, not the preparation's submission identity." }
        preparation: { $ref: '#/components/schemas/GatewaySettlementPreparation' }
    GatewaySettlementRefundCandidateReason:
      type: string
      enum: [UNSUPPORTED_PROVIDER, REFUND_EVENT_REQUIRED, UNSUPPORTED_DIRECTION, UNSUCCESSFUL_EVENT, UNSUPPORTED_CURRENCY, FRACTIONAL_PAISE, NON_POSITIVE_AMOUNT, MISSING_PAYMENT_REFERENCES, ORIGINAL_RECEIPT_UNRESOLVED, ORIGINAL_PAYMENT_SOURCE_AMBIGUOUS]
    GatewaySettlementRefundCandidates:
      type: object
      additionalProperties: false
      description: >-
        Bounded historical candidates ordered by posting date and completion identity.
        No global total or automatic association. REVIEW_REQUIRED has reasons, null
        receiptNumber and no items; CANDIDATE_CONTEXT has a resolved receipt and no
        reviewReasons. The browser requests 25 items. Even a sole or mentioned
        candidate still requires explicit association in settlement preparation.
      required: [schoolId, requestId, sourceReadId, rowIndex, settlementReference, reviewStage, state, eventReference, reportedAmount, currencyCode, receiptNumber, reviewReasons, page, pageSize, hasMore, items]
      properties:
        schoolId: { type: string, format: uuid }
        requestId: { type: string, format: uuid }
        sourceReadId: { type: string, format: uuid }
        rowIndex: { type: integer, minimum: 0, maximum: 9 }
        settlementReference: { type: string, maxLength: 100 }
        reviewStage: { type: string, const: HISTORICAL_REFUND_CANDIDATES_ONLY }
        state: { type: string, enum: [CANDIDATE_CONTEXT, REVIEW_REQUIRED] }
        eventReference: { type: string, maxLength: 100 }
        reportedAmount: { allOf: [{ $ref: "#/components/schemas/GatewaySettlementReportedMoney" }, { type: string }] }
        currencyCode: { type: string, pattern: '^[A-Z]{3}$' }
        receiptNumber: { type: [string, "null"], minLength: 1, maxLength: 100 }
        reviewReasons: { type: array, uniqueItems: true, maxItems: 10, items: { $ref: "#/components/schemas/GatewaySettlementRefundCandidateReason" } }
        page: { type: integer, minimum: 0, maximum: 10000 }
        pageSize: { type: integer, minimum: 1, maximum: 50 }
        hasMore: { type: boolean }
        items: { type: array, maxItems: 50, items: { $ref: "#/components/schemas/GatewaySettlementRefundCandidate" } }
      oneOf:
        - properties: { state: { const: CANDIDATE_CONTEXT }, receiptNumber: { type: string }, reviewReasons: { maxItems: 0 } }
        - properties: { state: { const: REVIEW_REQUIRED }, receiptNumber: { type: "null" }, reviewReasons: { minItems: 1 }, items: { maxItems: 0 }, hasMore: { const: false } }
    GatewaySettlementRefundCandidate:
      type: object
      additionalProperties: false
      description: >-
        One completed school refund. POSTED_SOURCE_PROVEN identifies historical
        unreversed accounting evidence only, not absence of a pending reversal or
        posting permission. Invalid proof remains ACCOUNTING_REVIEW_REQUIRED with
        no journal identity. referenceMention compares exact retained verified
        refund references; missing event or retained references are NOT_REPORTED.
      required: [refundPostingId, refundId, postedOn, amount, currencyCode, processedAt, accountingState, accountingJournalId, referenceMention]
      properties:
        refundPostingId: { type: string, format: uuid }
        refundId: { type: string, format: uuid }
        postedOn: { type: string, format: date }
        amount: { type: string, pattern: '^(0|[1-9][0-9]*)\.[0-9]{2}$' }
        currencyCode: { type: string, const: INR }
        processedAt: { type: [string, "null"], format: date-time, description: Retained exact UTC provider timestamp; never replaced with school posting time. }
        accountingState: { type: string, enum: [POSTED_SOURCE_PROVEN, ACCOUNTING_REVIEW_REQUIRED] }
        accountingJournalId: { type: [string, "null"], format: uuid }
        referenceMention: { type: string, enum: [MENTIONED, NOT_MENTIONED, NOT_REPORTED] }
      oneOf:
        - properties: { accountingState: { const: POSTED_SOURCE_PROVEN }, accountingJournalId: { type: string } }
        - properties: { accountingState: { const: ACCOUNTING_REVIEW_REQUIRED }, accountingJournalId: { type: "null" } }
    GatewaySettlementSourceReviewStage:
      type: string
      const: SOURCE_IDENTIFICATION_ONLY
      description: Historical source identity only, never bank/net reconciliation, provider activation or permission to post.
    GatewaySettlementSourceReviewReason:
      type: string
      enum:
        - UNSUPPORTED_PROVIDER
        - REFUND_ASSOCIATION_REVIEW
        - UNSUPPORTED_EVENT_TYPE
        - UNSUPPORTED_EVENT_DIRECTION
        - UNSUPPORTED_EVENT_STATUS
        - UNSUPPORTED_CURRENCY
        - FRACTIONAL_PAISE
        - NON_POSITIVE_GROSS
        - MISSING_PAYMENT_REFERENCES
        - DUPLICATE_PAYMENT_SOURCE
        - SOURCE_NOT_FOUND_OR_OUT_OF_SCOPE
        - AMBIGUOUS_PAYMENT_SOURCE
        - UNRESOLVED_NUMBERED_RECEIPT
        - GROSS_MISMATCH
        - ORIGINAL_POSTING_INVALID
        - CLEARING_EVIDENCE_UNAVAILABLE
        - LEGACY_BANK_CLEARING_REVIEW
        - INVALID_CLEARING_IDENTITY
      description: Bounded source-review reason, not a bank conclusion or instruction to adjust financial history. No partial or foreign source is exposed.
    GatewaySettlementSourceReview:
      type: object
      additionalProperties: false
      required: [schoolId, requestId, settlementReference, reviewStage, pagesRead, totalRows, sourceIdentifiedRows, reviewRequiredRows, page, pageSize, hasMore, items]
      description: The complete selected EVENTS chain is validated and classified before pagination. sourceIdentifiedRows plus reviewRequiredRows equals totalRows, including rows outside this page.
      properties:
        schoolId: { type: string, format: uuid }
        requestId: { type: string, format: uuid }
        settlementReference: { type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9_-]{0,99}$' }
        reviewStage: { $ref: "#/components/schemas/GatewaySettlementSourceReviewStage" }
        pagesRead: { type: integer, minimum: 1, maximum: 1000 }
        totalRows: { type: integer, format: int64, minimum: 0, maximum: 10000 }
        sourceIdentifiedRows: { type: integer, format: int64, minimum: 0, maximum: 10000 }
        reviewRequiredRows: { type: integer, format: int64, minimum: 0, maximum: 10000 }
        page: { type: integer, minimum: 0, maximum: 10000 }
        pageSize: { type: integer, minimum: 1, maximum: 50 }
        hasMore: { type: boolean }
        items: { type: array, maxItems: 50, items: { $ref: "#/components/schemas/GatewaySettlementSourceReviewRow" }, description: "Ordered by selected source page and zero-based physical row; sourceReadId/rowIndex is the identity, never eventReference alone." }
    GatewaySettlementSourceReviewRow:
      type: object
      additionalProperties: false
      required: [sourceReadId, rowIndex, observedAt, event, status, reasons, source]
      properties:
        sourceReadId: { type: string, format: uuid }
        rowIndex: { type: integer, minimum: 0, maximum: 9 }
        observedAt: { type: string, format: date-time }
        event: { $ref: "#/components/schemas/GatewaySettlementEvent" }
        status: { type: string, enum: [SOURCE_IDENTIFIED, REVIEW_REQUIRED] }
        reasons: { type: array, maxItems: 18, uniqueItems: true, items: { $ref: "#/components/schemas/GatewaySettlementSourceReviewReason" } }
        source: { anyOf: [{ $ref: "#/components/schemas/GatewaySettlementSourceReviewSource" }, { type: "null" }] }
      oneOf:
        - properties:
            status: { const: SOURCE_IDENTIFIED }
            reasons: { maxItems: 0 }
            source: { type: object }
        - properties:
            status: { const: REVIEW_REQUIRED }
            reasons: { minItems: 1 }
            source: { type: "null" }
    GatewaySettlementSourceReviewSource:
      type: object
      additionalProperties: false
      required: [captureId, paymentId, feeLedgerEntryId, receiptNumber, postingItemId, postingBatchId, configurationId, accountingJournalId, clearingAccountId, clearingAccountCategory, originalFinancialYearId, originalAccountingPeriodId, originalPostingDate, accountingBasis, currencyCode, grossAmount]
      description: One exact scoped historical online payment, its numbered receipt and original posted clearing identity. Closed historical books remain evidence, not an open-date admission or bank receipt.
      properties:
        captureId: { type: string, format: uuid }
        paymentId: { type: string, format: uuid }
        feeLedgerEntryId: { type: string, format: uuid }
        receiptNumber: { type: string, minLength: 1 }
        postingItemId: { type: string, format: uuid }
        postingBatchId: { type: string, format: uuid }
        configurationId: { type: string, format: uuid }
        accountingJournalId: { type: string, format: uuid }
        clearingAccountId: { type: string, format: uuid }
        clearingAccountCategory: { type: string, const: OTHER }
        originalFinancialYearId: { type: string, format: uuid }
        originalAccountingPeriodId: { type: string, format: uuid }
        originalPostingDate: { type: string, format: date }
        accountingBasis: { type: string, enum: [CASH, ACCRUAL] }
        currencyCode: { type: string, const: INR }
        grossAmount: { type: string, maxLength: 12, pattern: '^(?:0\.(?:0[1-9]|[1-9][0-9])|[1-9][0-9]{0,7}\.[0-9]{2}|100000000\.00)$', description: "Exact positive canonical historical gross INR decimal amount in paise precision, at most 100000000.00; not a floating-point number, net settlement calculation or bank balance." }
    GatewayRefundQueueStatus:
      type: string
      enum: [ALL, SUBMITTED, APPROVED, REJECTED, CANCELLED]
    GatewayRefundSelection:
      type: object
      additionalProperties: false
      required: [chargeId, amount]
      properties:
        chargeId: { type: string, format: uuid, description: Exact original receipt's paid charge; never a new account or an unrelated charge. }
        amount: { type: number, minimum: 0.01, maximum: 100000000, multipleOf: 0.01, description: Exact INR amount with no more than two decimal places. }
    GatewayRefundSubmit:
      type: object
      additionalProperties: false
      required: [schoolId, clientRequestId, allocations, reason]
      description: >-
        Immutable maker-scoped command. Charge IDs must be unique, selected amounts must
        fit each original refundable paid allocation, and their exact sum must be positive
        and at most INR 100000000. Allocation ordering does not change the request identity.
        The reason is stripped of surrounding whitespace and must contain 3 to 500 characters
        with no control characters. Keep this identity and the same terms for an unknown
        submission outcome; changing the identity must not be used to bypass reserved budget.
        Provider bindings, merchant references and credentials are selected only by the server.
      properties:
        schoolId: { type: string, format: uuid }
        clientRequestId: { type: string, format: uuid, description: Stable retry identity scoped to the actual maker and school. }
        allocations:
          type: array
          minItems: 1
          maxItems: 100
          x-unique-by: chargeId
          items: { $ref: "#/components/schemas/GatewayRefundSelection" }
        reason: { type: string, minLength: 3, maxLength: 500 }
    GatewayRefundDecisionCommand:
      type: object
      additionalProperties: false
      required: [schoolId, decision, reason]
      properties:
        schoolId: { type: string, format: uuid }
        decision:
          type: string
          enum: [APPROVE, REJECT, CANCEL]
          description: APPROVE/REJECT require an independent person; CANCEL is maker-only. One immutable decision per request.
        reason:
          type: string
          minLength: 3
          maxLength: 500
          description: Surrounding whitespace is stripped; normalized length must remain 3 to 500 characters and controls are rejected.
    GatewayRefundResult:
      type: object
      additionalProperties: false
      required: [id, paymentId, status]
      properties:
        id: { type: string, format: uuid, description: "Retained refund request identity, not a provider refund confirmation." }
        paymentId: { type: string, format: uuid, description: Original posted fee receipt identity. }
        status: { $ref: "#/components/schemas/GatewayRefundStatus" }
    GatewayRefundAllocation:
      type: object
      additionalProperties: false
      required: [chargeId, label, amount]
      properties:
        chargeId: { type: string, format: uuid }
        label: { type: string, description: Original charge label snapshot. }
        amount: { type: number, minimum: 0.01, maximum: 100000000, multipleOf: 0.01 }
    GatewayRefundDecision:
      type: object
      additionalProperties: false
      required: [id, decision, reason, decidedAt, decidedBy]
      properties:
        id: { type: string, format: uuid }
        decision: { type: string, enum: [APPROVE, REJECT, CANCEL] }
        reason: { type: string, minLength: 3, maxLength: 500 }
        decidedAt: { type: string, format: date-time, description: Original human decision instant; not provider processing time. }
        decidedBy: { type: string, description: Authorized reviewer or withdrawing maker's display name; no account contact is returned. }
    GatewayRefundProcessing:
      type: object
      additionalProperties: false
      required: [state, requiresReview, lastCheckedAt, nextCheckAt]
      description: >-
        Scoped retained processing evidence, not a new provider command or financial
        permission. DUES_RESTORED describes the fee subledger only; common-journal
        approval and external bank settlement must be checked separately. Stronger
        immutable money evidence remains visible alongside any later review warning.
      properties:
        state: { type: string, enum: [NOT_QUEUED, AWAITING_PROCESSING, PENDING_CONFIRMATION, PROVIDER_FAILED, REVIEW_REQUIRED, VERIFIED_AWAITING_POSTING, DUES_RESTORED] }
        requiresReview: { type: boolean }
        lastCheckedAt: { type: [string, "null"], format: date-time, description: Latest retained independent provider read; not an approval or payment time. }
        nextCheckAt: { type: [string, "null"], format: date-time, description: Next eligible queue time when background processing is enabled; not a promised execution time. }
    GatewayRefundRequest:
      type: object
      additionalProperties: false
      required: [id, paymentId, receiptNumber, learnerName, amount, currencyCode, status, reason, requestedAt, requestedBy, isMaker, canReview, canCancel, allocations, decision, processing]
      properties:
        id: { type: string, format: uuid }
        paymentId: { type: string, format: uuid }
        receiptNumber: { type: string, description: Original unchanged numbered fee receipt. }
        learnerName: { type: string }
        amount: { type: number, minimum: 0.01, maximum: 100000000, multipleOf: 0.01, description: Exact sum of the immutable selected allocation amounts. }
        currencyCode: { type: string, const: INR }
        status: { $ref: "#/components/schemas/GatewayRefundStatus" }
        reason: { type: string, minLength: 3, maxLength: 500 }
        requestedAt: { type: string, format: date-time, description: Original human request instant; no refund execution is implied. }
        requestedBy: { type: string, description: "Original maker's display name, not a contact or credential." }
        isMaker: { type: boolean, description: Whether the signed-in actual user made this request. }
        canReview: { type: boolean, description: Advisory hint for a submitted request and a different user with fees.refund; the decision write reauthorizes independently. }
        canCancel: { type: boolean, description: Advisory hint for the maker of a submitted request with fees.refund; no reviewed request can be withdrawn. }
        allocations:
          type: array
          minItems: 1
          maxItems: 100
          x-unique-by: chargeId
          items: { $ref: "#/components/schemas/GatewayRefundAllocation" }
        decision:
          description: Null while SUBMITTED; otherwise the one append-only independent review or maker withdrawal.
          oneOf:
            - { $ref: "#/components/schemas/GatewayRefundDecision" }
            - { type: "null" }
        processing:
          description: Present for APPROVED intent only; null for unreviewed, rejected or cancelled requests. Never infer completion from approval.
          oneOf:
            - { $ref: "#/components/schemas/GatewayRefundProcessing" }
            - { type: "null" }
    GatewayRefundSourceAllocation:
      type: object
      additionalProperties: false
      required: [chargeId, label, refundable, originalPaid, reserved, available]
      properties:
        chargeId: { type: string, format: uuid }
        label: { type: string, description: Original charge label snapshot. }
        refundable: { type: boolean, description: Current configured original fee-head eligibility; submission and approval revalidate it. }
        originalPaid: { type: number, minimum: 0.01, maximum: 100000000, multipleOf: 0.01, description: Amount paid to this exact charge by the original receipt. }
        reserved: { type: number, minimum: 0, maximum: 100000000, multipleOf: 0.01, description: Sum of this original allocation's submitted/approved refund requests; rejected/cancelled requests are excluded. }
        available: { type: number, minimum: 0, maximum: 100000000, multipleOf: 0.01, description: originalPaid minus reserved when currently refundable; otherwise zero. Not a fee outstanding amount. }
    GatewayRefundPayment:
      type: object
      additionalProperties: false
      required: [schoolId, paymentId, receiptNumber, accountId, learnerName, currencyCode, amount, reserved, available, canRequest, executionEnabled, allocations]
      description: >-
        Original historical receipt and present refund-intent budget. No provider order,
        payment or merchant reference, credential binding, contact or checkout URL is
        disclosed. Budget is revalidated on submission and is never permission to execute
        a refund. Requesting or approving a refund does not change existing fees or dues.
      properties:
        schoolId: { type: string, format: uuid }
        paymentId: { type: string, format: uuid }
        receiptNumber: { type: string }
        accountId: { type: string, format: uuid }
        learnerName: { type: string }
        currencyCode: { type: string, const: INR }
        amount: { type: number, minimum: 0.01, maximum: 100000000, multipleOf: 0.01, description: Original captured principal and original posted receipt amount; not a completed refund. }
        reserved: { type: number, minimum: 0, maximum: 100000000, multipleOf: 0.01, description: Sum of reserved across all original paid allocations. }
        available: { type: number, minimum: 0, maximum: 100000000, multipleOf: 0.01, description: Sum of the currently eligible allocations' available amounts; not necessarily amount minus reserved when a head is non-refundable. }
        canRequest: { type: boolean, description: Advisory hint requiring fees.refund and a positive eligible remainder; the POST remains authoritative. }
        executionEnabled: { type: boolean, description: "School-level NEW-processing configuration hint only; false by default. Does not establish eligibility for this receipt, credential availability, activation approval or financial completion." }
        allocations:
          type: array
          minItems: 1
          maxItems: 100
          x-unique-by: chargeId
          items: { $ref: "#/components/schemas/GatewayRefundSourceAllocation" }
    GatewayRefundQueue:
      type: object
      additionalProperties: false
      required: [schoolId, status, query, page, pageSize, total, hasMore, executionEnabled, items]
      properties:
        schoolId: { type: string, format: uuid }
        status: { $ref: "#/components/schemas/GatewayRefundQueueStatus" }
        query: { type: [string, "null"], maxLength: 100, description: "Stripped literal filter, or null for absent/blank input." }
        page: { type: integer, minimum: 0, maximum: 10000 }
        pageSize: { type: integer, minimum: 1, maximum: 50 }
        total: { type: integer, format: int64, minimum: 0 }
        hasMore: { type: boolean }
        executionEnabled: { type: boolean, description: School-level NEW-processing configuration hint only; false by default. Independent worker/refund/LIVE flags and an exact active configured provider are required. Never a success claim or activation authority. }
        items:
          type: array
          maxItems: 50
          x-unique-by: id
          items: { $ref: "#/components/schemas/GatewayRefundRequest" }
    CollectionRegisterSummary:
      type: object
      additionalProperties: false
      required: [collectionCount, grossCollections, reversalCount, reversalAmount, netCollections, refundCount, refundAmount]
      properties:
        collectionCount: { type: integer, format: int64, minimum: 0 }
        grossCollections: { type: number, minimum: 0, multipleOf: 0.01 }
        reversalCount: { type: integer, format: int64, minimum: 0 }
        reversalAmount: { type: number, minimum: 0, multipleOf: 0.01 }
        netCollections: { type: number, multipleOf: 0.01, description: Gross less receipt reversals less completed gateway refunds; may be negative for money returned from earlier collections. }
        refundCount: { type: integer, format: int64, minimum: 0 }
        refundAmount: { type: number, minimum: 0, multipleOf: 0.01, description: Only exact financially completed partial refund amounts; pending intents and verified HOLDs contribute nothing. }
    CollectionRegisterMovement:
      type: object
      additionalProperties: false
      required: [id, kind, paymentId, accountId, learnerId, learnerName, admissionNumber, gradeCode, sessionName, receiptNumber, paymentMethod, receiptStatus, amount, postingOn, recordedAt, timing, refundTiming]
      properties:
        id: { type: string, format: uuid }
        kind: { type: string, enum: [COLLECTION, REVERSAL, REFUND] }
        paymentId: { type: string, format: uuid }
        accountId: { type: string, format: uuid }
        learnerId: { type: string, format: uuid }
        learnerName: { type: string }
        admissionNumber: { type: [string, "null"] }
        gradeCode: { type: string }
        sessionName: { type: string }
        receiptNumber: { type: string }
        paymentMethod: { $ref: "#/components/schemas/FeePaymentMethod" }
        receiptStatus: { type: string, enum: [POSTED, REVERSED], description: Current receipt state; does not remove the original collection movement from its historical date. }
        amount: { type: number, exclusiveMinimum: 0, multipleOf: 0.01 }
        postingOn: { type: string, format: date }
        recordedAt: { type: string, format: date-time, description: Recording time for this movement; not money-received time. }
        timing: { $ref: "#/components/schemas/FeeReceiptTiming" }
        refundTiming:
          type: [object, "null"]
          additionalProperties: false
          description: Present only for REFUND. Original receipt received time remains in timing; this records actual refund processing, not reviewed posting or settlement.
          required: [processedOn, processedAt, schoolTimeZone]
          properties:
            processedOn: { type: string, format: date }
            processedAt: { type: string, format: date-time }
            schoolTimeZone: { type: string }
    CollectionRegisterResponse:
      type: object
      additionalProperties: false
      required: [schoolId, currencyCode, from, to, paymentMethod, query, page, pageSize, total, hasMore, summary, tenderTotals, items]
      properties:
        schoolId: { type: string, format: uuid }
        currencyCode: { type: string, pattern: '^[A-Z]{3}$' }
        from: { type: string, format: date }
        to: { type: string, format: date }
        paymentMethod: { type: [string, "null"], enum: [CASH, SCHOOL_UPI, BANK_TRANSFER, CHEQUE, ONLINE_PROVIDER, null] }
        query: { type: [string, "null"], maxLength: 100 }
        page: { type: integer, minimum: 0, maximum: 10000 }
        pageSize: { type: integer, minimum: 1, maximum: 100 }
        total: { type: integer, format: int64, minimum: 0 }
        hasMore: { type: boolean }
        summary: { $ref: "#/components/schemas/CollectionRegisterSummary" }
        tenderTotals:
          type: array
          minItems: 5
          maxItems: 5
          items:
            type: object
            additionalProperties: false
            required: [paymentMethod, summary]
            properties:
              paymentMethod: { $ref: "#/components/schemas/FeePaymentMethod" }
              summary: { $ref: "#/components/schemas/CollectionRegisterSummary" }
        items: { type: array, maxItems: 100, items: { $ref: "#/components/schemas/CollectionRegisterMovement" } }
    CollectionRegisterExportResponse:
      type: object
      additionalProperties: false
      required: [schoolId, schoolName, currencyCode, from, to, paymentMethod, query, generatedAt, total, summary, tenderTotals, items]
      properties:
        schoolId: { type: string, format: uuid }
        schoolName: { type: string }
        currencyCode: { type: string, pattern: '^[A-Z]{3}$' }
        from: { type: string, format: date }
        to: { type: string, format: date }
        paymentMethod: { type: [string, "null"], enum: [CASH, SCHOOL_UPI, BANK_TRANSFER, CHEQUE, ONLINE_PROVIDER, null] }
        query: { type: [string, "null"], maxLength: 100 }
        generatedAt: { type: string, format: date-time, description: "Server read-completion time, not a received/payment instant." }
        total: { type: integer, minimum: 0, maximum: 10000 }
        summary: { $ref: "#/components/schemas/CollectionRegisterSummary" }
        tenderTotals:
          type: array
          minItems: 5
          maxItems: 5
          items:
            type: object
            additionalProperties: false
            required: [paymentMethod, summary]
            properties:
              paymentMethod: { $ref: "#/components/schemas/FeePaymentMethod" }
              summary: { $ref: "#/components/schemas/CollectionRegisterSummary" }
        items: { type: array, maxItems: 10000, items: { $ref: "#/components/schemas/CollectionRegisterMovement" } }
    FinanceSnapshot:
      type: object
      additionalProperties: false
      required: [schoolId, schoolName, schoolCurrency, schoolTimeZone, schoolToday, latestClosedDate, canConfigure, canCollect, canApprove, canReverse, canProposeDayClose, canApproveDayClose, onlinePaymentStatus, ageing, dayCloseCandidate, dayCloses, sessions, feeHeads, feePlans, learners, accounts, concessions]
      properties:
        schoolId: { type: string, format: uuid }
        schoolName: { type: string }
        schoolCurrency: { type: string, pattern: "^[A-Z]{3}$" }
        schoolTimeZone: { type: string, description: Configured IANA school time zone used for received and posting dates. }
        schoolToday: { type: string, format: date }
        latestClosedDate: { type: [string, "null"], format: date, description: Latest approved finance close; earlier posting days remain locked. }
        canConfigure: { type: boolean }
        canCollect: { type: boolean }
        canApprove: { type: boolean }
        canReverse: { type: boolean }
        canProposeDayClose: { type: boolean }
        canApproveDayClose: { type: boolean }
        onlinePaymentStatus: { type: string, enum: [NOT_CONFIGURED, TEST_REDIRECT, LIVE_REDIRECT] }
        ageing: { $ref: "#/components/schemas/FeeAgeingSummary" }
        dayCloseCandidate: { $ref: "#/components/schemas/FeeDayCloseCandidate" }
        dayCloses:
          type: array
          items: { $ref: "#/components/schemas/FeeDayClose" }
        sessions: { type: array, items: { type: object, additionalProperties: true } }
        feeHeads: { type: array, items: { type: object, additionalProperties: true } }
        feePlans: { type: array, items: { type: object, additionalProperties: true } }
        learners: { type: array, items: { type: object, additionalProperties: true } }
        accounts:
          type: array
          items:
            type: object
            additionalProperties: true
            properties:
              rollNumber:
                type: [string, "null"]
                maxLength: 30
                description: Existing active placement effective on the school's current date, in this account's exact enrolment/session/school. Future, ended, unplaced or unavailable rolls are null; never inferred from another session.
              sectionCode:
                type: [string, "null"]
                maxLength: 30
                description: Matching active section of the effective placement, not an inferred historical section.
              payments:
                type: array
                items: { $ref: "#/components/schemas/StaffFeeReceipt" }
        concessions: { type: array, items: { type: object, additionalProperties: true } }
    StaffFeeReceipt:
      type: object
      additionalProperties: false
      required: [id, receiptNumber, paymentMethod, externalReference, amount, receivedOn, notes, status, createdAt, rowVersion, timing, gatewayRefundSource]
      properties:
        id: { type: string, format: uuid }
        receiptNumber: { type: string }
        paymentMethod: { $ref: "#/components/schemas/FeePaymentMethod" }
        externalReference: { type: [string, "null"] }
        amount: { type: number, exclusiveMinimum: 0 }
        receivedOn: { type: string, format: date }
        notes: { type: [string, "null"] }
        status: { type: string, enum: [POSTED, REVERSED] }
        createdAt: { type: string, format: date-time }
        rowVersion: { type: integer, format: int64, minimum: 0 }
        timing: { $ref: "#/components/schemas/FeeReceiptTiming" }
        gatewayRefundSource:
          type: boolean
          description: >-
            Staff-only source hint for a capture-backed ONLINE_PROVIDER receipt.
            Routes to existing scoped refund inspection without disclosing the capture UUID.
            Not refund eligibility, permission, approval or provider success; every read/write
            still requires its server-side school/actor/source validation. False for manual
            and legacy online-method receipts without retained capture backing.
    FeeCharge:
      type: object
      required: [id, feeHeadCode, feeHeadName, label, dueOn, amount, concessionAmount, paidAmount, outstandingAmount, allowPartial, rteExemptionAmount, reservedAmount]
      properties:
        id: { type: string, format: uuid }
        feeHeadCode: { type: string }
        feeHeadName: { type: string }
        label: { type: string }
        dueOn: { type: string, format: date }
        amount: { type: number, exclusiveMinimum: 0 }
        concessionAmount: { type: number, minimum: 0 }
        paidAmount: { type: number, minimum: 0 }
        outstandingAmount: { type: number, minimum: 0 }
        reservedAmount: { type: number, minimum: 0, description: Outstanding funds reserved by pending online attempts; not another fee or a payment. }
        allowPartial: { type: boolean }
        rteExemptionAmount:
          type: number
          minimum: 0
          description: Immutable automatic Admission/Tuition exemption from original RTE status for enrolments in Class I–VIII; included in concessionAmount, not an additional deduction.
    FeeHeadRequest:
      type: object
      additionalProperties: false
      required: [schoolId, code, name, category, refundable, status]
      properties:
        schoolId: { type: string, format: uuid }
        code: { type: string, pattern: "^[A-Za-z][A-Za-z0-9_ ]{1,29}$" }
        name: { type: string, minLength: 1, maxLength: 120 }
        description: { type: [string, "null"], maxLength: 500 }
        category: { type: string, enum: [TUITION, ADMISSION, ANNUAL, MATERIAL, TRANSPORT, ACTIVITY, EXAM, OTHER] }
        refundable: { type: boolean }
        status: { type: string, enum: [ACTIVE, INACTIVE] }
        expectedVersion: { type: [integer, "null"], format: int64, minimum: 0 }
        reason: { type: [string, "null"], maxLength: 240 }
    FeePlanRequest:
      type: object
      additionalProperties: false
      required: [schoolId, academicSessionId, code, revisionNumber, name, currencyCode, receiptPrefix]
      properties:
        schoolId: { type: string, format: uuid }
        academicSessionId: { type: string, format: uuid }
        supersedesPlanId: { type: [string, "null"], format: uuid }
        code: { type: string, pattern: "^[A-Za-z][A-Za-z0-9_ ]{1,39}$" }
        revisionNumber: { type: integer, minimum: 1, maximum: 1000 }
        name: { type: string, minLength: 1, maxLength: 140 }
        gradeCode: { type: [string, "null"], maxLength: 40 }
        currencyCode: { type: string, pattern: "^[A-Za-z]{3}$" }
        receiptPrefix: { type: string, pattern: "^[A-Za-z0-9][A-Za-z0-9/-]{1,23}$" }
        notes: { type: [string, "null"], maxLength: 1000 }
        expectedVersion: { type: [integer, "null"], format: int64, minimum: 0 }
        reason: { type: [string, "null"], maxLength: 240 }
    FeePlanItemRequest:
      type: object
      additionalProperties: false
      required: [schoolId, feeHeadId, sequenceNumber, label, dueOn, amount, allowPartial]
      properties:
        schoolId: { type: string, format: uuid }
        feeHeadId: { type: string, format: uuid }
        sequenceNumber: { type: integer, minimum: 1, maximum: 1000 }
        label: { type: string, minLength: 1, maxLength: 140 }
        dueOn: { type: string, format: date }
        amount: { type: number, minimum: 0.01, maximum: 100000000, multipleOf: 0.01 }
        allowPartial: { type: boolean }
        reason: { type: [string, "null"], maxLength: 240 }
    FeePlanActivationRequest:
      type: object
      additionalProperties: false
      required: [schoolId, expectedVersion, publicDisclosure, reason]
      properties:
        schoolId: { type: string, format: uuid }
        expectedVersion: { type: integer, format: int64, minimum: 0 }
        publicDisclosure: { type: boolean }
        reason: { type: string, minLength: 1, maxLength: 240 }
    FeePlanAssignmentRequest:
      type: object
      additionalProperties: false
      required: [schoolId, feePlanId, enrolmentId, reason]
      properties:
        schoolId: { type: string, format: uuid }
        feePlanId: { type: string, format: uuid }
        enrolmentId: { type: string, format: uuid }
        reason: { type: string, minLength: 1, maxLength: 240 }
    FeeConcessionRequest:
      type: object
      additionalProperties: false
      required: [schoolId, accountId, chargeId, concessionType, amount, reason]
      properties:
        schoolId: { type: string, format: uuid }
        accountId: { type: string, format: uuid }
        chargeId: { type: string, format: uuid }
        concessionType: { type: string, enum: [SCHOLARSHIP, SIBLING, STAFF, HARDSHIP, OTHER] }
        amount: { type: number, minimum: 0.01, maximum: 100000000, multipleOf: 0.01 }
        reason: { type: string, minLength: 1, maxLength: 500 }
    FeeConcessionDecisionRequest:
      type: object
      additionalProperties: false
      required: [schoolId, decision, reason, expectedVersion]
      properties:
        schoolId: { type: string, format: uuid }
        decision: { type: string, enum: [APPROVED, REJECTED] }
        reason: { type: string, minLength: 1, maxLength: 500 }
        expectedVersion: { type: integer, format: int64, minimum: 0 }
    FeePaymentAllocation:
      type: object
      additionalProperties: false
      required: [chargeId, amount]
      properties:
        chargeId: { type: string, format: uuid }
        amount: { type: number, minimum: 0.01, maximum: 100000000, multipleOf: 0.01 }
    FeePaymentRequest:
      type: object
      additionalProperties: false
      description: >-
        Manual collection only, independent of gateway activation. Cash remains compatible
        with honest date-only legacy requests. A new BANK_TRANSFER or SCHOOL_UPI collection
        requires an actual received timestamp and explicit credited-bank-funds verification;
        a reference, screenshot or payer success screen alone is insufficient. Exact historic
        idempotent retries return the existing receipt without manufacturing new verification.
        Preserve the original received date/time and supply an eligible open posting date plus
        review reason for a closed original day. Excess amounts are rejected, not silently
        treated as advances. ONLINE_PROVIDER is not accepted by this endpoint.
      required: [schoolId, accountId, paymentMethod, amount, receivedOn]
      properties:
        schoolId: { type: string, format: uuid }
        accountId: { type: string, format: uuid }
        paymentMethod: { type: string, enum: [CASH, BANK_TRANSFER, CHEQUE, SCHOOL_UPI] }
        externalReference: { type: [string, "null"], maxLength: 120 }
        amount: { type: number, minimum: 0.01, maximum: 100000000, multipleOf: 0.01 }
        receivedOn: { type: string, format: date, description: Original school-local received day; not a request to reopen a closed accounting day. }
        actualReceivedAt: { type: [string, "null"], format: date-time, description: Actual received instant whose school-local day equals receivedOn; never inferred from recording time. }
        postingOn: { type: [string, "null"], format: date, description: Explicit eligible open posting day when reviewed; omission uses the original day only if eligible. }
        bankCreditVerification: { $ref: "#/components/schemas/ManualBankCreditVerification" }
        reviewReason: { type: [string, "null"], minLength: 3, maxLength: 240 }
        notes: { type: [string, "null"], maxLength: 500 }
        allocations:
          type: [array, "null"]
          maxItems: 1000
          items: { $ref: "#/components/schemas/FeePaymentAllocation" }
    ManualBankCreditVerification:
      type: [object, "null"]
      additionalProperties: false
      required: [sourceKind, confirmedReceived]
      description: >-
        The authorized collector has checked the actual credited entry in the school's bank
        app or bank statement, not an uploaded payer screenshot. Where a UTR is unavailable,
        use the bank's actual identifiable credited-entry reference. If both this reference
        and externalReference are supplied, they must normalize to the same credit identity.
        Do not invent an application identifier as proof of settlement.
      properties:
        sourceKind: { type: string, enum: [BANK_APP_CREDIT, BANK_STATEMENT_CREDIT] }
        confirmedReceived: { type: boolean, const: true }
        creditedEntryReference: { type: [string, "null"], maxLength: 120 }
    FeePaymentReversalRequest:
      type: object
      additionalProperties: false
      required: [schoolId, expectedVersion, reason]
      properties:
        schoolId: { type: string, format: uuid }
        expectedVersion: { type: integer, format: int64, minimum: 0 }
        reason: { type: string, minLength: 1, maxLength: 240 }
    FeeAgeingSummary:
      type: object
      additionalProperties: false
      required: [asOf, totalOutstanding, accountCount, overdueAccountCount, current, days1To30, days31To60, days61To90, daysOver90, accounts]
      properties:
        asOf: { type: string, format: date }
        totalOutstanding: { type: number, minimum: 0 }
        accountCount: { type: integer, minimum: 0 }
        overdueAccountCount: { type: integer, minimum: 0 }
        current: { type: number, minimum: 0 }
        days1To30: { type: number, minimum: 0 }
        days31To60: { type: number, minimum: 0 }
        days61To90: { type: number, minimum: 0 }
        daysOver90: { type: number, minimum: 0 }
        accounts:
          type: array
          items: { $ref: "#/components/schemas/FeeAgeingAccount" }
    FeeAgeingAccount:
      type: object
      additionalProperties: false
      required: [accountId, learnerName, gradeCode, sessionName, currencyCode, current, days1To30, days31To60, days61To90, daysOver90, totalOutstanding, maximumDaysOverdue]
      properties:
        accountId: { type: string, format: uuid }
        learnerName: { type: string }
        admissionNumber: { type: [string, "null"] }
        gradeCode: { type: string }
        sessionName: { type: string }
        currencyCode: { type: string, pattern: "^[A-Z]{3}$" }
        current: { type: number, minimum: 0 }
        days1To30: { type: number, minimum: 0 }
        days31To60: { type: number, minimum: 0 }
        days61To90: { type: number, minimum: 0 }
        daysOver90: { type: number, minimum: 0 }
        totalOutstanding: { type: number, minimum: 0 }
        oldestDueOn: { type: [string, "null"], format: date }
        maximumDaysOverdue: { type: integer, minimum: 0 }
    FeeTenderSystemTotal:
      type: object
      additionalProperties: false
      required: [paymentMethod, systemAmount]
      properties:
        paymentMethod: { $ref: "#/components/schemas/FeePaymentMethod" }
        systemAmount: { type: number }
    FeeTenderTotal:
      type: object
      additionalProperties: false
      required: [paymentMethod, systemAmount, declaredAmount, variance]
      properties:
        paymentMethod: { $ref: "#/components/schemas/FeePaymentMethod" }
        systemAmount: { type: number }
        declaredAmount: { type: number, description: Negative only for a reviewed genuinely refund-negative ONLINE_PROVIDER tender; all other methods stay nonnegative. }
        variance: { type: number }
    FeeDayCloseCandidate:
      type: object
      additionalProperties: false
      required: [businessDate, currencyCode, collectionCount, grossCollections, reversalCount, reversalAmount, netCollections, tenderTotals, refundCount, refundAmount]
      properties:
        businessDate: { type: string, format: date }
        currencyCode: { type: string, pattern: "^[A-Z]{3}$" }
        collectionCount: { type: integer, minimum: 0 }
        grossCollections: { type: number, minimum: 0 }
        reversalCount: { type: integer, minimum: 0 }
        reversalAmount: { type: number, minimum: 0 }
        refundCount: { type: integer, minimum: 0 }
        refundAmount: { type: number, minimum: 0 }
        netCollections: { type: number }
        tenderTotals:
          type: array
          items: { $ref: "#/components/schemas/FeeTenderSystemTotal" }
    FeeDayClose:
      type: object
      additionalProperties: false
      required: [id, businessDate, revisionNumber, currencyCode, status, collectionCount, grossCollections, reversalCount, reversalAmount, netCollections, declaredTotal, varianceTotal, tenderTotals, evidenceSha256, submissionReason, submittedBy, submittedAt, rowVersion, refundCount, refundAmount]
      properties:
        id: { type: string, format: uuid }
        businessDate: { type: string, format: date }
        revisionNumber: { type: integer, minimum: 1 }
        supersedesCloseId: { type: [string, "null"], format: uuid }
        currencyCode: { type: string, pattern: "^[A-Z]{3}$" }
        status: { type: string, enum: [PENDING, APPROVED, REJECTED] }
        collectionCount: { type: integer, minimum: 0 }
        grossCollections: { type: number, minimum: 0 }
        reversalCount: { type: integer, minimum: 0 }
        reversalAmount: { type: number, minimum: 0 }
        refundCount: { type: integer, minimum: 0 }
        refundAmount: { type: number, minimum: 0 }
        netCollections: { type: number }
        declaredTotal: { type: number, description: Sum of independently declared tender totals; may be negative only with genuine completed gateway refunds. }
        varianceTotal: { type: number }
        tenderTotals:
          type: array
          items: { $ref: "#/components/schemas/FeeTenderTotal" }
        evidenceSha256: { type: string, pattern: "^[a-f0-9]{64}$" }
        submissionReason: { type: string }
        varianceReason: { type: [string, "null"] }
        submittedBy: { type: string }
        submittedAt: { type: string, format: date-time }
        decidedBy: { type: [string, "null"] }
        decidedAt: { type: [string, "null"], format: date-time }
        decisionReason: { type: [string, "null"] }
        rowVersion: { type: integer, format: int64, minimum: 0 }
    FeePaymentMethod:
      type: string
      enum: [CASH, BANK_TRANSFER, CHEQUE, SCHOOL_UPI, ONLINE_PROVIDER]
    FeeTenderDeclaration:
      type: object
      additionalProperties: false
      required: [paymentMethod, declaredAmount]
      properties:
        paymentMethod: { $ref: "#/components/schemas/FeePaymentMethod" }
        declaredAmount: { type: number, minimum: -100000000, maximum: 100000000, multipleOf: 0.01, description: "A negative value is allowed only for ONLINE_PROVIDER with actual completed refunds and negative system net for the chosen school date, bounded by that net; otherwise nonnegative." }
      allOf:
        - if:
            properties: { paymentMethod: { const: ONLINE_PROVIDER } }
            required: [paymentMethod]
          else:
            properties: { declaredAmount: { minimum: 0 } }
    FeeDayCloseRequest:
      type: object
      additionalProperties: false
      required: [schoolId, businessDate, declarations, reason]
      properties:
        schoolId: { type: string, format: uuid }
        businessDate: { type: string, format: date }
        declarations:
          type: array
          minItems: 5
          maxItems: 5
          items: { $ref: "#/components/schemas/FeeTenderDeclaration" }
        reason: { type: string, minLength: 1, maxLength: 500 }
        varianceReason: { type: [string, "null"], maxLength: 500 }
    FeeDayCloseDecisionRequest:
      type: object
      additionalProperties: false
      required: [schoolId, decision, reason, expectedVersion]
      properties:
        schoolId: { type: string, format: uuid }
        decision: { type: string, enum: [APPROVED, REJECTED] }
        reason: { type: string, minLength: 1, maxLength: 500 }
        expectedVersion: { type: integer, format: int64, minimum: 0 }
    FamilyGatewayPaymentAvailability:
      type: string
      enum: [AVAILABLE, DISABLED, UNAVAILABLE]
      description: >-
        Eligibility hint for starting a new request, not the outcome of an existing payment.
        AVAILABLE requires exactly one active, complete trusted school/provider binding and
        the relevant gateway enablement flags. DISABLED covers operator-disabled creation,
        processing or live-mode opt-in. UNAVAILABLE covers absent, ambiguous or mismatched
        current provider configuration. Existing history remains readable in all three states.
    FamilyGatewayPaymentStatus:
      type: string
      enum: [PAID, REVIEW_REQUIRED, READY, PENDING, EXPIRED, RELEASED]
      description: >-
        Server-derived status only. PAID means the exact verified fee payment and numbered
        receipt are posted. REVIEW_REQUIRED means money/attempt evidence requires school
        review; it may preserve an existing original receipt when additional money is under
        review, and is never permission to pay again. READY means a currently eligible private
        continuation is available to this initiating guardian. PENDING means server verification
        or checkout preparation is unfinished, not failed. EXPIRED means the original checkout
        deadline passed; expiry alone never proves zero received money or releases a reservation.
        RELEASED means the reservation was explicitly released, not paid. Browser success,
        redirects, missing provider responses and unknown states must not be mapped to PAID.
    FamilyGatewayChargeSelection:
      type: object
      additionalProperties: false
      required: [chargeId, amount]
      properties:
        chargeId: { type: string, format: uuid }
        amount:
          type: number
          minimum: 0.01
          maximum: 100000000
          multipleOf: 0.01
          description: Exact INR allocation, at most two decimal places; eligible outstanding minus active reservations and school full-only/partial rules are revalidated server-side.
    FamilyGatewayInitiateRequest:
      type: object
      additionalProperties: false
      required: [clientRequestId, allocations, payerPhone]
      description: >-
        Immutable body-level request identity, account selection and selected terms. Omitted
        or null accountId preserves the legacy CURRENT_SESSION mode; a supplied accountId
        selects immutable EXPLICIT_ACCOUNT mode. A retry cannot change either mode or its
        exact original account, including after academic-year rollover or account selection
        changes in the browser. Allocation charge IDs must
        be unique and belong to the child's one eligible original account. The total is positive
        and bounded by INR 100000000. No guessed INR 1 minimum is imposed; positive paise and
        school/provider eligibility are authoritative. Retry an uncertain result with exactly
        this body and key. No school, provider route, currency, receipt or paid flag is accepted
        from the browser. Never persist this body or its private contact in browser storage.
      properties:
        clientRequestId: { type: string, format: uuid, description: One unpredictable UUID reused unchanged for retries of this same actor/child/account selection. }
        accountId:
          type: [string, "null"]
          format: uuid
          description: Optional exact current or historical fee account. New checkout requires live own-child authorization and an ACTIVE account with current accounting/provider eligibility; null or omission keeps legacy current-session selection. This value is part of the immutable retry terms, not authority to reopen an account or activate academics.
        allocations:
          type: array
          minItems: 1
          maxItems: 100
          uniqueItems: true
          x-unique-by: chargeId
          items: { $ref: "#/components/schemas/FamilyGatewayChargeSelection" }
        payerPhone:
          type: string
          minLength: 10
          maxLength: 10
          pattern: "^[0-9]{10}$"
          writeOnly: true
          description: Private 10-digit Indian payer phone used for the original hosted checkout, protected server-side and never returned in status/history/continuation.
    FamilyGatewaySelectedCharge:
      type: object
      additionalProperties: false
      required: [chargeId, label, dueOn, amount]
      properties:
        chargeId: { type: string, format: uuid }
        label: { type: string }
        dueOn: { type: string, format: date }
        amount: { type: number, minimum: 0.01, maximum: 100000000, multipleOf: 0.01 }
    FamilyGatewayReceipt:
      type: object
      additionalProperties: false
      required: [paymentId, receiptNumber, postingOn]
      description: >-
        The exact existing verified posted fee receipt, not a new collection or browser-created
        PDF. Download actions use the existing learner-scoped issued-document/PDF workflow.
        postingOn is the accounting posting date; it must not be presented as an invented exact
        gateway-paid timestamp. Original provider/payment timestamps remain immutable evidence.
      properties:
        paymentId: { type: string, format: uuid }
        receiptNumber: { type: string }
        postingOn: { type: string, format: date }
    FamilyGatewayPayment:
      type: object
      additionalProperties: false
      required: [id, learnerId, accountId, sessionName, amount, currencyCode, status, createdAt, expiresAt, originalBusinessDate, reservationActive, initiatedByYou, canContinue, selectedCharges, receipt]
      description: >-
        Minimal own-child, exact-account summary. No provider credentials, routing identifier,
        payer phone, private hosted URL, raw callback or private work evidence is included.
        Selected amounts sum exactly to amount and charge IDs are unique. PAID requires a
        non-null exact posted receipt. REVIEW_REQUIRED may have no receipt or retain the
        originally posted receipt while additional evidence is reviewed; other statuses have
        no posted receipt. canContinue is advisory and true only with READY, an active
        reservation and initiatedByYou; an explicit CSRF-protected POST must still reauthorize
        disclosure. Neither this response nor a return-page query can mark a fee paid.
      properties:
        id: { type: string, format: uuid, description: "Original gateway attempt identity, not a browser-issued receipt." }
        learnerId: { type: string, format: uuid }
        accountId: { type: string, format: uuid }
        sessionName: { type: string }
        amount: { type: number, minimum: 0.01, maximum: 100000000, multipleOf: 0.01 }
        currencyCode: { type: string, const: INR }
        status: { $ref: "#/components/schemas/FamilyGatewayPaymentStatus" }
        createdAt: { type: string, format: date-time, description: "Original request creation instant, not the payment/provider confirmation time." }
        expiresAt: { type: string, format: date-time, description: Original immutable checkout expiry; passing it does not automatically cancel money verification. }
        originalBusinessDate: { type: string, format: date, description: "Original reserved financial day, preserved even if later reviewed posting must use an eligible open date." }
        reservationActive: { type: boolean, description: Whether this original attempt still holds an active allocation; not proof that fees were paid. }
        initiatedByYou: { type: boolean, description: Whether the signed-in guardian initiated this exact attempt; no other guardian's identity or contact is disclosed. }
        canContinue: { type: boolean, description: Advisory permission hint only; never a hosted URL or a guarantee that a later disclosure remains eligible. }
        selectedCharges:
          type: array
          minItems: 1
          maxItems: 100
          x-unique-by: chargeId
          items: { $ref: "#/components/schemas/FamilyGatewaySelectedCharge" }
        receipt:
          oneOf:
            - { $ref: "#/components/schemas/FamilyGatewayReceipt" }
            - { type: "null" }
    FamilyGatewayPaymentHistory:
      type: object
      additionalProperties: false
      required: [learnerId, availability, page, pageSize, hasMore, payments]
      properties:
        learnerId: { type: string, format: uuid }
        availability: { $ref: "#/components/schemas/FamilyGatewayPaymentAvailability" }
        page: { type: integer, minimum: 0, maximum: 10000 }
        pageSize: { type: integer, const: 20 }
        hasMore: { type: boolean }
        payments:
          type: array
          maxItems: 20
          x-unique-by: id
          description: Current page only, ordered by original creation time and attempt ID descending. Every item belongs to the requested verified child; no checkout URL appears here.
          items: { $ref: "#/components/schemas/FamilyGatewayPayment" }
    FamilyGatewayContinuation:
      type: object
      additionalProperties: false
      required: [attemptId, checkoutUrl, expiresAt]
      description: >-
        Sensitive action-local response from the explicit initiating-guardian continuation POST.
        Only this response contains a private hosted URL; no new checkout is created. Consume
        it only for the explicit user navigation, without logging, analytics, prefetch, browser
        persistence or caching. Success uses Cache-Control no-store/private, Vary Cookie and
        Referrer-Policy no-referrer. The URL alone is not evidence of successful payment.
      properties:
        attemptId: { type: string, format: uuid }
        checkoutUrl:
          type: string
          format: uri
          maxLength: 240
          pattern: '^https://payments(?:-test)?\.cashfree\.com/links/[A-Za-z0-9_-]{1,100}$'
          description: Exact canonical original HTTPS hosted URL for the server-configured TEST or LIVE Cashfree binding; no credentials, explicit port, query, fragment, encoded path or alternate hostname is allowed.
        expiresAt: { type: string, format: date-time, description: "Original immutable deadline, still in the future at the final server-side eligibility check." }
    FamilyFeeAccountSummary:
      type: object
      additionalProperties: false
      required: [id, sessionId, sessionName, status, currencyCode, balance, currentSession]
      description: Minimal exact-child account summary; balance is the signed actual ledger balance and excludes unposted refund evidence.
      properties:
        id: { type: string, format: uuid }
        sessionId: { type: string, format: uuid }
        sessionName: { type: string }
        status: { type: string, enum: [ACTIVE, CLOSED] }
        currencyCode: { type: string, pattern: "^[A-Z]{3}$" }
        balance: { type: number, multipleOf: 0.01, description: Signed actual fee-ledger balance; negative credit balances are retained rather than clamped to zero. }
        currentSession: { type: boolean, description: Whether this account belongs to the child's latest-active academic session; not a statement that the account is payable. }
    FamilyFeeAccountsResponse:
      type: object
      additionalProperties: false
      required: [learnerId, currentAccountId, page, pageSize, hasMore, accounts]
      properties:
        learnerId: { type: string, format: uuid }
        currentAccountId: { type: [string, "null"], format: uuid, description: "Latest-active academic-session account, or null when there is no current account; it need not appear on the requested page." }
        page: { type: integer, minimum: 0, maximum: 10000 }
        pageSize: { type: integer, minimum: 1, maximum: 50 }
        hasMore: { type: boolean }
        accounts:
          type: array
          maxItems: 50
          x-unique-by: id
          items: { $ref: "#/components/schemas/FamilyFeeAccountSummary" }
    FamilyFeesResponse:
      type: object
      additionalProperties: false
      required: [learnerId, academicSessionName, currencyCode, onlinePaymentStatus, totalCharges, totalCredits, balance, charges, receipts, statement, refunds]
      properties:
        learnerId: { type: string, format: uuid }
        accountId: { type: [string, "null"], format: uuid }
        academicSessionName: { type: string }
        currencyCode: { type: string, pattern: "^[A-Z]{3}$" }
        onlinePaymentStatus: { type: string, enum: [NOT_CONFIGURED, TEST_REDIRECT, LIVE_REDIRECT] }
        totalCharges: { type: number }
        totalCredits: { type: number }
        balance: { type: number }
        charges: { type: array, items: { $ref: "#/components/schemas/FeeCharge" } }
        receipts: { type: array, items: { $ref: "#/components/schemas/FamilyFeeReceipt" } }
        statement: { type: array, items: { type: object, additionalProperties: true } }
        refunds:
          type: array
          description: >-
            Completed original-account financial refund movements only. Pending provider
            evidence, requests, approvals and unposted holds are never listed as returned
            money or restored dues. Original receipt amount/number remain unchanged.
            Own-child and exact account scope apply, including an explicitly selected
            historical fee account. No provider credentials, staff data, source hashes or
            internal refund-request payloads are exposed.
          items: { $ref: "#/components/schemas/FamilyFeeRefund" }
    FamilyFeeRefund:
      type: object
      additionalProperties: false
      required: [id, paymentId, receiptNumber, amount, currencyCode, postingOn, processedAtExact, processedOn, schoolTimeZone]
      properties:
        id: { type: string, format: uuid, description: Retained financial refund posting identity. }
        paymentId: { type: string, format: uuid, description: Original numbered payment receipt identity. }
        receiptNumber: { type: string, description: "Original receipt is unchanged, not a replacement receipt." }
        amount: { type: number, exclusiveMinimum: 0, multipleOf: 0.01, description: Actual completed refund amount restored to this original account's dues. }
        currencyCode: { type: string, pattern: "^[A-Z]{3}$" }
        postingOn: { type: string, format: date, description: "Reviewed financial posting day, possibly later than the preserved original refund day." }
        processedAtExact: { type: string, format: date-time, description: "Exact original verified gateway refund time, not posting or receipt time." }
        processedOn: { type: string, format: date, description: Original verified refund day in its preserved school time zone. }
        schoolTimeZone: { type: string, description: Preserved IANA school time zone used for the original refund day. }
    FeeReceiptTiming:
      type: object
      additionalProperties: false
      required: [originalReceivedOn, actualReceivedAt, receivedTimePrecision, schoolTimeZone]
      properties:
        originalReceivedOn: { type: string, format: date }
        actualReceivedAt: { type: [string, "null"], format: date-time, description: Immutable known received instant; never receipt recording or PDF issuance time. }
        receivedTimePrecision: { type: string, enum: [INSTANT, DATE_ONLY] }
        schoolTimeZone: { type: [string, "null"], description: Persisted evidence zone; null for historical receipts without a recorded zone. }
    FamilyFeeReceipt:
      type: object
      additionalProperties: false
      required: [paymentId, receiptNumber, paymentMethod, amount, receivedOn, status, issuedAt, timing]
      properties:
        paymentId: { type: string, format: uuid }
        receiptNumber: { type: string }
        paymentMethod: { $ref: "#/components/schemas/FeePaymentMethod" }
        amount: { type: number, exclusiveMinimum: 0 }
        receivedOn: { type: string, format: date, description: Existing accounting posting day; timing.originalReceivedOn is when money was received. }
        status: { type: string, enum: [POSTED, REVERSED] }
        issuedAt: { type: string, format: date-time, description: "Receipt recording time, not payment time." }
        timing: { $ref: "#/components/schemas/FeeReceiptTiming" }
    PublicFeeDisclosureResponse:
      type: object
      additionalProperties: false
      required: [schoolName, currencyCode, retrievedAt, plans]
      properties:
        schoolName: { type: string }
        currencyCode: { type: string, pattern: "^[A-Z]{3}$" }
        retrievedAt: { type: string, format: date-time }
        plans:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [academicSession, planName, revisionNumber, lines]
            properties:
              academicSession: { type: string }
              planName: { type: string }
              gradeCode: { type: [string, "null"] }
              revisionNumber: { type: integer, minimum: 1 }
              lines:
                type: array
                items:
                  type: object
                  additionalProperties: false
                  required: [feeHead, label, dueOn, amount, allowPartial]
                  properties:
                    feeHead: { type: string }
                    label: { type: string }
                    dueOn: { type: string, format: date }
                    amount: { type: number, minimum: 0.01 }
                    allowPartial: { type: boolean }
    CreateEnquiryRequest:
      type: object
      additionalProperties: false
      required: [name, email, message, privacyAccepted]
      properties:
        name: { type: string, minLength: 2, maxLength: 100 }
        email: { type: string, format: email, maxLength: 254 }
        phone: { type: string, maxLength: 30 }
        topic: { type: string, maxLength: 60 }
        message: { type: string, minLength: 10, maxLength: 2000 }
        intent:
          type: string
          enum: [general, visit, application]
          default: general
        privacyAccepted: { type: boolean, const: true }
    EnquiryResponse:
      type: object
      required: [reference, receivedAt, status]
      properties:
        reference: { type: string, pattern: "^ENQ-[A-F0-9]{10}$" }
        receivedAt: { type: string, format: date-time }
        status: { type: string, const: received }
    EnquiryStatus:
      type: string
      enum: [NEW, OPEN, QUALIFIED, CLOSED, SPAM]
    StaffEnquiryIntent:
      type: string
      enum: [GENERAL, VISIT, APPLICATION]
    EnquiryAssignee:
      type: object
      required: [membershipId, schoolId, displayName]
      properties:
        membershipId: { type: string, format: uuid }
        schoolId: { type: string, format: uuid }
        displayName: { type: string }
    EnquiryListItem:
      type: object
      required:
        [
          id,
          reference,
          name,
          email,
          intent,
          status,
          source,
          createdAt,
          updatedAt,
          version,
        ]
      properties:
        id: { type: string, format: uuid }
        reference: { type: string, pattern: "^ENQ-[A-F0-9]{10}$" }
        name: { type: string }
        email: { type: string, format: email }
        phone: { type: [string, "null"] }
        topic: { type: [string, "null"] }
        intent: { $ref: "#/components/schemas/StaffEnquiryIntent" }
        status: { $ref: "#/components/schemas/EnquiryStatus" }
        source:
          { type: string, enum: [WEBSITE, PHONE, WALK_IN, REFERRAL, OTHER] }
        assignee:
          oneOf:
            - $ref: "#/components/schemas/EnquiryAssignee"
            - type: "null"
        followUpAt: { type: [string, "null"], format: date-time }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        version: { type: integer, format: int64, minimum: 0 }
    EnquiryMetrics:
      type: object
      required:
        [newCount, openCount, qualifiedCount, overdueCount, unassignedCount]
      properties:
        newCount: { type: integer, format: int64, minimum: 0 }
        openCount: { type: integer, format: int64, minimum: 0 }
        qualifiedCount: { type: integer, format: int64, minimum: 0 }
        overdueCount: { type: integer, format: int64, minimum: 0 }
        unassignedCount: { type: integer, format: int64, minimum: 0 }
    EnquiryPageResponse:
      type: object
