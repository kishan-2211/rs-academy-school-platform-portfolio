      summary: Reconcile approved employee advances, schedules, disbursements and payroll recoveries
      description: Requires payroll.read and accounting.read in the same active school scope. Audited, no-store, repeatable-read evidence. dueThrough controls which immutable installments are classified as due or overdue; disbursement, recovery, reversal and reservation evidence is current when the report is loaded and is not presented as a historical point-in-time ledger. Approved advances issued through the selected date are included. Ledger-derived disbursement, recovery, outstanding and overdue values are null when source, provenance, amount, reversal or aggregate evidence does not reconcile. Pages contain at most 100 rows and total matching count.
