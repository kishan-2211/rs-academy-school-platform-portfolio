openapi: 3.1.1
info:
  title: EduCore API
  version: 0.1.0
  description: Versioned browser and mobile API for the EduCore school platform.
  contact:
    name: EduCore engineering
  license:
    name: Proprietary; see repository NOTICE
    identifier: LicenseRef-Proprietary
servers:
  - url: /api/v1
    description: Same-origin deployment
tags:
  - name: Student leave
    description: School-configured full-day student leave, verified-family requests, independent decisions and immutable private evidence.
  - name: System
    description: Safe operational status for deployment health checks.
  - name: Public admissions
    description: Public enquiry intake without account creation.
  - name: Admissions operations
    description: School-scoped admissions follow-up for authorized staff.
  - name: Admission applications
    description: Applicant review, document checklist, controlled decisions, and enrolment handoff.
  - name: Student registry
    description: School-scoped learner, guardian relationship, enrolment, and section placement records.
  - name: Student imports
    description: Controlled school-scoped previews, duplicate decisions, and transactional canonical commits.
  - name: Guardian portal access
    description: Relationship-scoped guardian invitations, public acceptance, and revocation controls.
  - name: Staff account access
    description: Controlled staff invitations, one-use private handoff and atomic account-holder acceptance with existing session and MFA controls.
  - name: Family portal
    description: Guardian self-service limited to accepted active learner relationships.
  - name: Student portal
    description: Guardian-approved learner-owned access restricted to the signed-in learner's own academic records.
  - name: Academics
    description: Authority-managed terms, subjects, books, syllabus, teaching allocations, bell schedules, immutable published timetables, and allocation-scoped teacher views.
  - name: Attendance
    description: Configurable dated registers, frozen policy evidence, reviewed corrections, and relationship-scoped family attendance.
  - name: School calendar
    description: Append-only bilingual holidays and closures, authority-confirmed session rules, maker-checker publication, attendance synchronization, and due-time family notification evidence.
  - name: Assessment
    description: Configurable schemes, assigned marks entry, maker-checker publication, controlled corrections, and immutable report-card versions.
  - name: Learning
    description: Assigned-teacher assignments, frozen audiences, published revisions, relationship-scoped responses, and review history.
  - name: Private files
    description: Quarantined, malware-scanned, context-authorized private object upload and download.
  - name: Finance
    description: Configurable fee plans, frozen learner charges, sequential receipts, maker-checker concessions, and append-only ledger evidence.
  - name: Communication
    description: Versioned bilingual templates, frozen audiences, maker-checker announcements, inbox evidence, and provider-neutral delivery state.
  - name: Notifications
    description: Authenticated self-service notification preferences and encrypted browser push registrations without exposing device capability material.
  - name: People
    description: Configurable employment records, effective-dated assignments, restricted evidence, safe offboarding, and approved public staff snapshots.
  - name: School configuration
    description: Authority-confirmed school identity and versioned campus configuration with explicit school scope and audit reasons.
  - name: Reporting
    description: Audited school-scoped operational aggregates with explicit definitions and no personal record payloads.
  - name: Official documents
    description: Versioned bilingual templates, maker-checker issuance, private PDFs, cancellation or supersession, and privacy-safe public verification.
  - name: Transport
    description: Versioned routes, explicit staff eligibility, vehicle readiness, frozen rosters, append-only journey events, and relationship-scoped family transport.
  - name: Authentication
    description: Password, session, and multi-factor sign-in flows.
  - name: Account security
    description: Authenticated controls for factors, recovery, and devices.
  - name: School context
    description: Verified organisation membership and capability context.
paths:
  /me/preferences:
    get:
      operationId: readMyLanguagePreference
      tags: [Account security]
      summary: Read the signed-in account's language preference
      description: Account-wide preference, never another user's. A missing preferredLanguage means the user has not chosen yet. Responses are no-store.
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Current preference; also establishes the browser CSRF cookie
          content:
            application/json:
              schema:
                type: object
                properties:
                  preferredLanguage:
                    type: [string, 'null']
                    enum: [en, hi, null]
        '401':
          description: No valid authenticated session
    put:
      operationId: updateMyLanguagePreference
      tags: [Account security]
      summary: Set the signed-in account's language preference
      description: Idempotent, validated and audited. No caller-supplied user or school identifier is accepted. A valid session and matching CSRF cookie/header are required.
      security:
        - sessionCookie: []
      parameters:
        - in: header
          name: X-CSRF-TOKEN
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [preferredLanguage]
              properties:
                preferredLanguage:
                  type: string
                  enum: [en, hi]
      responses:
        '200':
          description: Saved preference; identical retries do not create duplicate audit events
          content:
            application/json:
              schema:
                type: object
                required: [preferredLanguage]
                properties:
                  preferredLanguage:
                    type: string
                    enum: [en, hi]
        '400':
          description: Missing or unsupported language
        '401':
          description: No valid authenticated session
        '403':
          description: Missing or invalid CSRF protection
  /student-leave:
    get:
      operationId: studentLeaveWorkspace
      tags:
        - Student leave
      summary: Read the authorized management leave queue and session policies
      security:
        - sessionCookie: []
      parameters:
        - name: schoolId
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: status
          in: query
          schema:
            type: string
            enum:
              - SUBMITTED
              - APPROVED
              - REJECTED
              - WITHDRAWN
              - REVOKED
        - name: page
          in: query
          schema:
            type: integer
            minimum: 0
            maximum: 10000
            default: 0
      responses:
        '200':
          description: School-scoped student leave response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudentLeaveWorkspace'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /student-leave/policy:
    put:
      operationId: saveStudentLeavePolicy
      tags:
        - Student leave
      summary: Configure session leave limits and an enabled absence state without changing submitted request snapshots
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StudentLeavePolicyRequest'
      responses:
        '200':
          description: School-scoped student leave response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudentLeaveMutation'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /student-leave/{id}:
    get:
      operationId: studentLeaveDetail
      tags:
        - Student leave
      summary: Read private leave evidence with current school management authority
      security:
        - sessionCookie: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: schoolId
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: School-scoped student leave response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudentLeaveDetail'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /student-leave/{id}/decision:
    post:
      operationId: decideStudentLeave
      tags:
        - Student leave
      summary: Independently approve, reject or revoke leave without silently changing submitted attendance
      security:
        - sessionCookie: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StudentLeaveDecisionRequest'
      responses:
        '200':
          description: School-scoped student leave response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudentLeaveMutation'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /family/children/{learnerId}/leave:
    get:
      operationId: familyStudentLeaveWorkspace
      tags:
        - Student leave
      summary: Read only the requesting guardian's leave records for their verified child
      security:
        - sessionCookie: []
      parameters:
        - name: learnerId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: page
          in: query
          schema:
            type: integer
            minimum: 0
            maximum: 10000
            default: 0
      responses:
        '200':
          description: School-scoped student leave response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FamilyStudentLeaveWorkspace'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    post:
      operationId: submitStudentLeave
      tags:
        - Student leave
      summary: Submit full-day leave within configured date and enrolment bounds with retry and overlap protection
      security:
        - sessionCookie: []
      parameters:
        - name: learnerId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StudentLeaveSubmitRequest'
      responses:
        '201':
          description: School-scoped student leave response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudentLeaveMutation'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /family/children/{learnerId}/leave/{id}:
    get:
      operationId: familyStudentLeaveDetail
      tags:
        - Student leave
      summary: Read the requesting guardian's own child leave request and immutable history
      security:
        - sessionCookie: []
      parameters:
        - name: learnerId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: School-scoped student leave response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudentLeaveDetail'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /family/children/{learnerId}/leave/{id}/withdrawal:
    post:
      operationId: withdrawStudentLeave
      tags:
        - Student leave
      summary: Withdraw own pending or approved unended leave with a reason and current version
      security:
        - sessionCookie: []
      parameters:
        - name: learnerId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StudentLeaveWithdrawalRequest'
      responses:
        '200':
          description: School-scoped student leave response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudentLeaveMutation'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /system/status:
    get:
      operationId: getSystemStatus
      tags: [System]
      summary: Return the safe API status
      security: []
      responses:
        "200":
          description: Service is responding.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemStatus"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /public/enquiries:
    post:
      operationId: createPublicEnquiry
      tags: [Public admissions]
      summary: Submit a public school or admissions enquiry
      security: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateEnquiryRequest"
      responses:
        "202":
          description: Enquiry accepted for processing.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnquiryResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          description: Idempotency key was reused with different content.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ApiProblem"
  /admissions/enquiries:
    get:
      operationId: listAdmissionsEnquiries
      tags: [Admissions operations]
      summary: List admissions enquiries visible to the signed-in staff member
      security:
        - sessionCookie: []
      parameters:
        - name: status
          in: query
          schema: { $ref: "#/components/schemas/EnquiryStatus" }
        - name: intent
          in: query
          schema: { $ref: "#/components/schemas/StaffEnquiryIntent" }
        - name: query
          in: query
          schema: { type: string, maxLength: 100 }
        - name: page
          in: query
          schema: { type: integer, minimum: 0, maximum: 100000, default: 0 }
        - name: size
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
      responses:
        "200":
          description: A school-scoped page and current funnel metrics.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnquiryPageResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /admissions/enquiries/{enquiryId}:
    parameters:
      - name: enquiryId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: getAdmissionsEnquiry
      tags: [Admissions operations]
      summary: Get one accessible enquiry and its private follow-up notes
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Enquiry detail.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnquiryDetailResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateAdmissionsEnquiry
      tags: [Admissions operations]
      summary: Progress, assign, schedule, or annotate an enquiry
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateEnquiryRequest"
      responses:
        "200":
          description: Updated enquiry detail.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnquiryDetailResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /admissions/enquiries/{enquiryId}/assignees:
    get:
      operationId: listAdmissionsEnquiryAssignees
      tags: [Admissions operations]
      summary: List active admissions users who can own the selected enquiry
      security:
        - sessionCookie: []
      parameters:
        - name: enquiryId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Eligible assignees from the enquiry's school.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EnquiryAssignee"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /admissions/applications:
    get:
      operationId: listAdmissionApplications
      tags: [Admission applications]
      summary: List applications visible through a same-school admissions capability
      security:
        - sessionCookie: []
      parameters:
        - name: admissionType
          in: query
          schema: { $ref: "#/components/schemas/AdmissionType" }
        - name: status
          in: query
          schema: { $ref: "#/components/schemas/ApplicationStatus" }
        - name: query
          in: query
          schema: { type: string, maxLength: 100 }
        - name: page
          in: query
          schema: { type: integer, minimum: 0, maximum: 100000, default: 0 }
        - name: size
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
      responses:
        "200":
          description: A school-scoped application page and current pipeline metrics.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApplicationPageResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      operationId: createAdmissionApplication
      tags: [Admission applications]
      summary: Create a draft application from a qualified enquiry or authorized staff intake
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateApplicationRequest" }
      responses:
        "201":
          description: Draft application created, including its guardian contacts.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApplicationDetailResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /admissions/applications/{applicationId}:
    parameters:
      - $ref: "#/components/parameters/ApplicationId"
    get:
      operationId: getAdmissionApplication
      tags: [Admission applications]
      summary: Get an application after same-school object authorization
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Application, guardians, document checklist, decisions, and enrolment state.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApplicationDetailResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      operationId: updateAdmissionApplication
      tags: [Admission applications]
      summary: Correct editable applicant, intake, and ownership fields
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateApplicationRequest" }
      responses:
        "200":
          description: Updated application.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApplicationDetailResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /admissions/applications/{applicationId}/status:
    patch:
      operationId: updateAdmissionApplicationStatus
      tags: [Admission applications]
      summary: Move an application through a non-decision workflow stage
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/ApplicationId"
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              { $ref: "#/components/schemas/UpdateApplicationStatusRequest" }
      responses:
        "200":
          description: Application at its new stage.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApplicationDetailResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /admissions/applications/{applicationId}/guardians:
    post:
      operationId: addAdmissionApplicationGuardian
      tags: [Admission applications]
      summary: Add a guardian contact before enrolment handoff
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/ApplicationId"
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              { $ref: "#/components/schemas/AddApplicationGuardianRequest" }
      responses:
        "201":
          description: Guardian contact added.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApplicationDetailResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /admissions/applications/{applicationId}/guardians/{guardianId}:
    patch:
      operationId: updateAdmissionApplicationGuardian
      tags: [Admission applications]
      summary: Correct a guardian contact with optimistic version protection
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/ApplicationId"
        - name: guardianId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              { $ref: "#/components/schemas/UpdateApplicationGuardianRequest" }
      responses:
        "200":
          description: Guardian contact corrected.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApplicationDetailResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /admissions/applications/{applicationId}/documents:
    post:
      operationId: addAdmissionApplicationDocument
      tags: [Admission applications]
      summary: Add a school-confirmed item to an application document checklist
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/ApplicationId"
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              { $ref: "#/components/schemas/AddApplicationDocumentRequest" }
      responses:
        "201":
          description: Checklist item added.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApplicationDetailResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
