        - { $ref: "#/components/parameters/PayrollReportPage" }
        - { $ref: "#/components/parameters/PayrollReportSize" }
      responses:
        "200":
          description: School-scoped report page. Currency is explicit per row; no mixed-currency total is synthesized.
          content: { application/json: { schema: { $ref: "#/components/schemas/PayrollRegisterPage" } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /payroll/accounting/reports/register.csv:
    get:
      operationId: exportPayrollRegisterCsv
      tags: [Payroll]
      summary: Download the complete filtered report as a protected UTF-8 CSV
      description: Requires payroll.read and accounting.read in the same active school scope. Audited, no-store, repeatable-read evidence. From/to are inclusive payroll-month first days; frozen values are preserved on reversed runs, whose current unsettled amount is zero. Unknown payment evidence has null amounts. Rejects more than 5000 matching rows; no silent truncation. Untrusted text is spreadsheet-formula-neutralized.
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: schoolId, in: query, schema: { type: string, format: uuid } }
        - { $ref: "#/components/parameters/PayrollReportFrom" }
        - { $ref: "#/components/parameters/PayrollReportTo" }
        - { $ref: "#/components/parameters/PayrollReportStaff" }
        - { $ref: "#/components/parameters/PayrollReportSearch" }
