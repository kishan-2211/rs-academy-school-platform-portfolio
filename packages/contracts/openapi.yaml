        accounting.read. Validates the complete unfiltered selected COMPLETE EVENTS
        chain and resolves the physical sourceReadId/rowIndex, never eventReference
        alone. For supported successful INR refund debit events, resolves the exact
        school/provider/environment/merchant/order/payment source and lists completed
        refund postings with that exact payment, amount and currency. Closed historical
        accounts remain readable. No matching candidates is not proof that no refund
        occurred. Amount/reference matches, even a unique candidate, never associate
        the event. Reference mentions are contextual only. Each candidate's historical
        journal proof is checked; an invalid proof remains visible for accounting
        review, while authority failures and infrastructure errors propagate. Historical
        proof does not rule out pending reversals or admit settlement posting. This
        read makes no provider call or financial, audit, selection or request write.
        It returns no bank confirmation, posting permission, credentials or private
        provider payload. Association belongs in independently reviewed settlement preparation.
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: requestId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: schoolId, in: query, required: true, schema: { type: string, format: uuid } }
        - { name: sourceReadId, in: query, required: true, schema: { type: string, format: uuid } }
        - { name: rowIndex, in: query, required: true, schema: { type: integer, minimum: 0, maximum: 9 } }
        - { name: page, in: query, schema: { type: integer, minimum: 0, maximum: 10000, default: 0 } }
        - { name: pageSize, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 25 } }
